": "১৯৭১ সালের ৩ মার্চ পল্টন ময়দানে তৎকালীন ডাকসু ভিপি আ স ম আবদুর রব কর্তৃক।", "category": "ইতিহাস"}, {"id": 202, "question": "স্বাধীন বাংলাদেশের প্রথম পতাকা কে এবং কবে উত্তোলন করেন?", "answer": "১৯৭১ সালের ২ মার্চ ঢাকা বিশ্ববিদ্যালয়ের বটতলায় ডাকসু ভিপি আ স ম আবদুর রব প্রথম জাতীয় পতাকা উত্তোলন করেন।", "category": "ইতিহাস"}, {"id": 203, "question": "স্বাধীনতার ইশতেহার কবে এবং কোথায় পাঠ করা হয়?", "answer": "১৯৭১ সালের ৩ মার্চ ঐতিহাসিক পল্টন ময়দানে ছাত্রলীগের সাধারণ সম্পাদক শাজাহান সিরাজ পাঠ করেন।", "category": "ইতিহাস"}, {"id": 204, "question": "মুক্তিযুদ্ধের প্রথম সশস্ত্র প্রতিরোধ কোথায় এবং কবে সংঘটিত হয়?", "answer": "১৯৭১ সালের ১৯ মার্চ গাজীপুরের জয়দেবপুরে ইস্ট বেঙ্গল রেজিমেন্টের বাঙালি সেনাদের দ্বারা।", "category": "মুক্তিযুদ্ধ"}, {"id": 205, "question": "অপারেশন জ্যাকপট (Operation Jackpot) কী ছিল?", "answer": "১৯৭১ সালের ১৫ আগস্ট মধ্যরাতে নৌ-কমান্ডোরা একযোগে চট্টগ্রাম ও মোংলা বন্দরসহ বিভিন্ন নৌবন্দরে পাকিস্তানি যুদ্ধজাহাজ ধ্বংসের আত্মঘাতী অভিযান।", "category": "মুক্তিযুদ্ধ"}, {"id": 206, "question": "মুক্তিযুদ্ধে জেড ফোর্স, কে ফোর্স এবং এস ফোর্সের কমান্ডার কে ছিলেন?", "answer": "জেড ফোর্সের জিয়াউর রহমান, কে ফোর্সের খালেদ মোশাররফ এবং এস ফোর্সের কে এম সফিউল্লাহ।", "category": "মুক্তিযুদ্ধ"}, {"id": 207, "question": "মুজিবনগর সরকারের সর্বদলীয় উপদেষ্টা পরিষদের চেয়ারম্যান কে ছিলেন?", "answer": "মওলানা আব্দুল হামিদ খান ভাসানী।", "category": "মুক্তিযুদ্ধ"}, {"id": 208, "question": "মুক্তিযুদ্ধে যৌথ কমান্ডের প্রধান কে ছিলেন?", "answer": "লেফটেন্যান্ট জেনারেল জগজিৎ সিং অরোরা (ভারত-বাংলাদেশ যৌথ বাহিনীর প্রধান)।", "category": "মুক্তিযুদ্ধ"}, {"id": 209, "question": "পাকিস্তানি হানাদার বাহিনীর আত্মসমর্পণ দলিলে কে কে স্বাক্ষর করেন?", "answer": "যৌথ কমান্ডের পক্ষে লেফটেন্যান্ট জেনারেল জগজিৎ সিং অরোরা এবং পাকিস্তানি বাহিনীর পক্ষে লেফটেন্যান্ট জেনারেল এ কে নিয়াজী।", "category": "মুক্তিযুদ্ধ"}, {"id": 210, "question": "বীরশ্রেষ্ঠ নূর মোহাম্মদ শেখ কোন সেক্টরে এবং কোন পদে যুদ্ধ করেন?", "answer": "৮ নম্বর সেক্টরে; ইস্ট পাকিস্তান রাইফেলসের (EPR) ল্যান্স নায়েক ছিলেন (শহ ubject": "সাধারণ জ্ঞান", "subject_code": "GK-06", "topic": "কম্পিউটার ও তথ্যপ্রযুক্তি", "topic_en": "Computer & ICT Basics", "total_items": 65, "description": "সমাজসেবা ও মন্ত্রণালয়ের নিয়োগ পরীক্ষায় কম্পিউটার ও আইসিটি বিষয়ের লিখিত প্রশ্নোত্তর ও সংক্ষিপ্ত ব্যাখ্যা।", "exam_tip": "কম্পিউটারের বিভিন্ন যন্ত্রাংশ, শর্টকাট কি এবং অফিস সফটওয়্যার সংক্রান্ত প্রশ্ন প্রতি বছর লিখিত পরীক্ষায় আসে।", "items": [{"id": 1, "question": "কম্পিউটারের জনক কে?", "answer": "চার্লস ব্যাবেজ (Charles Babbage)। আধুনিক কম্পিউটারের জনক জন ভন নিউম্যান এবং আধুনিক কম্পিউটার বিজ্ঞানের জনক অ্যালান টুরিং।"}, {"id": 2, "question": "কম্পিউটারের মস্তিষ্ক বা ব্রেইন বলা হয় কোন অংশকে?", "answer": "সিপিইউ (CPU - Central Processing Unit)-কে। এটি মূলত এএলইউ (ALU), কন্ট্রোল ইউনিট এবং রেজিস্টার মেমোরির সমন্বয়ে গঠিত।"}, {"id": 3, "question": "র‍্যাম (RAM) এবং রম (ROM) এর মধ্যে প্রধান পার্থক্য কী?", "answer": "RAM (Random Access Memory) হলো কম্পিউটারের অস্থায়ী বা উদ্বায়ী (Volatile) মেমোরি যা বিদ্যুৎ চলে গেলে মুছে যায়। আর ROM (Read Only Memory) হলো স্থায়ী বা অনুদ্বায়ী (Non-volatile) মেমোরি যা অপরিবর্তনযোগ্য।"}, {"id": 4, "question": "অপারেটিং সিস্টেম (Operating System) কী? ৩টি উদাহরণ দিন।", "answer": "অপারেটিং সিস্টেম হলো সিস্টেম সফটওয়্যার যা কম্পিউটারের হার্ডওয়্যার এবং ব্যবহারকারীর অ্যাপ্লিকেশনের মধ্যে সেতুবন্ধন হিসেবে কাজ করে। উদাহরণ: Microsoft Windows, Linux, macOS।"}, {"id": 5, "question": "হার্ডওয়্যার ও সফটওয়্যারের মধ্যে পার্থক্য কী?", "answer": "কম্পিউটারের যেসকল যন্ত্রাংশ স্পর্শ করা যায় ও দেখা যায় তা হলো হার্ডওয়্যার (যেমন: মনিটর, কী-বোর্ড, সিপিইউ)। আর যেসকল প্রোগ্রাম বা নির্দেশাবলি হার্ডওয়্যার পরিচালনা করে তা হলো সফটওয়্যার (যেমন: উইন্ডোজ, এমএস ওয়ার্ড)।"}, {"id": 6, "question": "ই-মেইলে CC এবং BCC এর পূর্ণরূপ ও অর্থ কী?", "answer": "CC = Carbon Copy (ই-মেইলের অনুলিপি অন্য কাউকে পাঠানো যা সকল প্রাপক দেখতে পান)। BCC = Blind Carbon Copy (গোপন অনুলিপি যা অন্য প্রাপকরা দেখতে পান না)।"}, {"id": 7, "question": "কম্পিউটারে ব্যবহৃত ৪টি বহুল ব্যবহৃত শর্টকাট কমান্ড লিখুন।", "answer": "১. Ctrl + C (কপি করা), ২. Ctrl + V (পেস্ট করা), ৩. Ctrl + Z (পূর্বাবস্থায় ফিরে যাওয়া বা Undo), ৪. Ctrl + S (ফাইল সংরক্ষণ করা বা Save)।"}, {"id": 8, "question": "১ কিলোবাইট (KB) সমান কত বাইট এবং ১ মেগাবাইট (MB) সমান কত?", "answer": "১ বাইট = ৮ বিট; ১ কিলোবাইট (KB) = ১০২৪ বাইট; ১ মেগাবাইট (MB) = ১০২৪ কিলোবাইট (KB); ১ গিগাবাইট (GB) = ১০২৪ মেগাবাইট (MB)।"}, {"id": 9, "question": "এমএস ওয়ার্ড (MS Word) এবং এমএস এক্সেল (MS Excel) এর প্রধান কাজ কী?", "answer": "MS Word হলো একটি ওয়ার্ড প্রসেসিং সফটওয়্যার যার মাধ্যমে চিঠিপত্র, দলিল ও প্রতিবেদন প্রস্তুত করা হয়। আর MS Excel হলো একটি স্প্রেডশিট সফটওয়্যার যা গাণিতিক হিসাব-নিকাশ, বাজেট ও ডেটা বিশ্লেষণের জন্য ব্যবহৃত হয়।"}, {"id": 10, "question": "ইন্টারনেট ও ডোমেন নেমে www এবং .gov.bd এর অর্থ কী?", "answer": "www = World Wide Web (বিশ্বব্যাপী ওয়েব সংযোগ)। .gov = সরকারি ওয়েবসাইট ডোমেন (Government); .bd = বাংলাদেশের কান্ট্রি কোড টপ-লেভেল ডোমেন।"}, {"id": 11, "question": "ফায়ারওয়াল (Firewall) কী এবং এর কাজ কী?", "answer": "ফায়ারওয়াল হলো একটি নেটওয়ার্ক নিরাপত্তা ব্যবস্থা যা পূর্বনির্ধারিত নিরাপত্তা বিধিমালার ভিত্তিতে নেটওয়ার্কের অভ্যন্তরীণ ও বহিরাগত ট্র্যাফিক পর্যবেক্ষণ ও নিয়ন্ত্রণ করে অননুমোদিত অ্যাক্সেস বা সাইবার আক্রমণ ঠেকায়।"}, {"id": 12, "question": "ক্লাউড কম্পিউটিং (Cloud Computing) কী?", "answer": "ইন্টারনেটের মাধ্যমে দূরবর্তী সার্ভারে ডেটা সংরক্ষণ, পরিচালনা ও প্রক্রিয়াকরণ করার সেবাকে ক্লাউড কম্পিউটিং বলে (যেমন: Google Drive, Microsoft OneDrive, Dropbox)।"}, {"id": 13, "question": "ম্যালওয়্যার ও অ্যান্টিভাইরাস কী?", "answer": "ম্যালওয়্যার (Malicious Software) হলো ক্ষতিকারক সফটওয়্যার যা কম্পিউটারের ক্ষতিসাধন বা তথ্য চুরি করে (যেমন: ভাইরাস, ট্রোজান হর্স)। অ্যান্টিভাইরাস হলো প্রতিরক্ষামূলক সফটওয়্যার যা ম্যালওয়্যার শনাক্ত ও ধ্বংস করে (যেমন: Kaspersky, Avast)।"}, {"id": 14, "question": "কী-বোর্ডের F1 থেকে F12 বোতামগুলোকে কী বলে?", "answer": "ফাংশন কি (Function Keys)। এর মধ্যে F1 সাধারণত Help (সহায়তা) এবং F5 সাধারণত Refresh (পুনরায় লোড) করার জন্য ব্যবহৃত হয়।"}, {"id": 15, "question": "কৃত্রিম বুদ্ধিমত্তা বা এআই (Artificial Intelligence) কী?", "answer": "মানুষের বুদ্ধিমত্তা, চিন্তাশক্তি ও যৌক্তিক সিদ্ধান্ত গ্রহণের ক্ষমতাকে কম্পিউটার বা মেশিনের মাধ্যমে অনুকরণ ও প্রয়োগ করার বিজ্ঞানকে কৃত্রিম বুদ্ধিমত্তা (AI) বলে।"}, {"id": 16, "question": "ইনপুট ও আউটপুট ডিভাইস কী? ৩টি করে উদাহরণ দিন।", "answer": "ইনপুট ডিভাইস: যার মাধ্যমে কম্পিউটারে ডেটা বা নির্দেশ প্রবেশ করানো হয় (যেমন: কী-বোর্ড, মাউস, স্ক্যানার, মাইক্রোফোন)। আউটপুট ডিভাইস: যার মাধ্যমে প্রক্রিয়াকৃত ফলাফল ব্যবহারকারী দেখতে বা পেতে পারেন (যেমন: মনিটর, প্রিন্টার, স্পিকার, প্রজেক্টর)।"}, {"id": 17, "question": "কম্পিউটারের প্রজন্ম (Computer Generations) কয়টি?", "answer": "৫টি প্রজন্ম। ১ম প্রজন্ম: ভ্যাকুয়াম টিউব; ২য় প্রজন্ম: ট্রানজিস্টর; ৩য় প্রজন্ম: আইসি (IC - Integrated Circuit); ৪র্থ প্রজন্ম: মাইক্রোপ্রসেসর/ভিএলএসআই (VLSI); ৫ম প্রজন্ম: কৃত্রিম বুদ্ধিমত্তা ও অপটিক্যাল প্রযুক্তি।"}, {"id": 18, "question": "বিআইওএস (BIOS) কী এবং এর কাজ কী?", "answer": "BIOS = Basic Input/Output System। এটি রমের (ROM) মধ্যে সংরক্ষিত একটি ফার্মওয়্যার যা কম্পিউটার চালু (Boot) করার সময় হার্ডওয়্যার চেক করে এবং অপারেটিং সিস্টেম লোড করতে সাহায্য করে।"}, {"id": 19, "question": "কম্পিউটার ভাইরাস কী? ৩টি পরিচিত ভাইরাসের নাম লিখুন।", "answer": "ভাইরাস (VIRUS - Vital Information Resources Under Siege) হলো ক্ষতিকারক প্রোগ্রাম কোড যা ব্যবহারকারীর অনুমতি ছাড়াই ফাইলে ছড়িয়ে পড়ে কম্পিউটারের ক্ষতিসাধন করে। উদাহরণ: সিআইএইচ (CIH), মেলিসা (Melissa), ট্রোজান হর্স।"}, {"id": 20, "question": "ওয়াই-ফাই (Wi-Fi) এবং ব্লুটুথ (Bluetooth) এর মধ্যে পার্থক্য কী?", "answer": "Wi-Fi হলো উচ্চগতির ওয়্যারলেস লোকাল এরিয়া নেটওয়ার্ক প্রযুক্তি (পরিসীমা প্রায় ১০০ মিটার পর্যন্ত)। আর Bluetooth হলো স্বল্প দূরত্বের (সাধারণত ১০ মিটার) মধ্যে ব্যক্তিগত ডিভাইসগুলোর মধ্যে তথ্য আদান-প্রদানের বেতার প্রযুক্তি।"}, {"id": 21, "question": "ইউআরএল (URL) এর বিভিন্ন অংশ ব্যাখ্যা করুন।", "answer": "URL = Uniform Resource Locator। যেমন: https://www.dss.gov.bd। এখানে https হলো প্রটোকল, www হলো সাব-ডোমেন, dss হলো ডোমেন নাম এবং .gov.bd হলো টপ-লেভেল সরকারি ডোমেন।"}, {"id": 22, "question": "পিডিএফ (PDF) ফাইলের পূর্ণরূপ ও সুবিধা কী?", "answer": "PDF = Portable Document Format। অ্যাডোবি (Adobe) উদ্ভাবিত এই ফাইল ফরম্যাট যেকোনো অপারেটিং সিস্টেম বা ডিভাইসে অবিকল একই লেআউট, ফন্ট ও গ্রাফিক্স অক্ষুণ্ণ রাখে।"}, {"id": 23, "question": "বিট (Bit) ও বাইট (Byte) কাকে বলে?", "answer": "বাইনারি ডিজিট (০ এবং ১)-কে সংক্ষেপে বিট (Bit) বলে। ৮টি বিট একত্রিত হয়ে ১ বাইট (Byte) গঠন করে। ১ বাইট সাধারণত একটি বর্ণ বা অক্ষর সংরক্ষণের জন্য ব্যবহৃত হয়।"}, {"id": 24, "question": "ডাটাবেজ ও আরডিবিএমএস (RDBMS) কী?", "answer": "পরস্পর সম্পর্কযুক্ত তথ্যের সুশৃঙ্খল সংগ্রহকে ডাটাবেজ বলে। রিলেশনাল ডাটাবেজ ম্যানেজমেন্ট সিস্টেম (RDBMS) হলো টেবিলের মাধ্যমে ডেটা সংরক্ষণ ও কোয়েরি করার সফটওয়্যার (যেমন: MySQL, Oracle, MS Access)।"}, {"id": 25, "question": "সাইবার অপরাধ ও তথ্যপ্রযুক্তি আইন কী?", "answer": "কম্পিউটার বা ইন্টারনেট ব্যবহার করে সংঘটিত যেকোনো অপরাধ (যেমন: হ্যাকিং, আর্থিক জালিয়াতি, তথ্য চুরি, অপপ্রচার) হলো সাইবার অপরাধ। বাংলাদেশে সাইবার নিরাপত্তা নিশ্চিত করতে সাইবার সুরক্ষা সংক্রান্ত আইন কার্যকর রয়েছে।"}, {"id": 26, "question": "ই-কমার্স (E-commerce) এবং ই-গভর্ন্যান্স (E-governance) কী?", "answer": "ই-কমার্স হলো ইন্টারনেটের মাধ্যমে অনলাইনে পণ্য বা সেবা কেনাবেচা করা। ই-গভর্ন্যান্স হলো সরকারি সেবাসমূহ ডিজিটাল প্রযুক্তির মাধ্যমে জনগণের দোরগোড়ায় স্বচ্ছ ও দ্রুততার সাথে পৌঁছে দেওয়া।"}, {"id": 27, "question": "কী-বোর্ডের ব্যাকস্পেস (Backspace) এবং ডিলিট (Delete) বোতামের পার্থক্য কী?", "answer": "Backspace বোতাম কার্সরের বাম পাশের অক্ষর মুছে ফেলে। আর Delete বোতাম কার্সরের ডান পাশের অক্ষর মুছে ফেলে।"}, {"id": 28, "question": "অফিস সফটওয়্যারে আনডু (Undo) ও রিডু (Redo) এর কাজ কী?", "answer": "Undo (Ctrl+Z) ভুল করে মুছে যাওয়া বা সম্পাদিত কাজকে পূর্বের অবস্থায় ফিরিয়ে আনে। Redo (Ctrl+Y) আনডু করা কাজকে পুনরায় কার্যকর করে।"}, {"id": 29, "question": "স্থানীয় নেটওয়ার্ক (LAN) এবং বিস্তৃত নেটওয়ার্ক (WAN) এর পূর্ণরূপ ও অর্থ কী?", "answer": "LAN = Local Area Network (একটি কক্ষ, ভবন বা ক্যাম্পাসের অভ্যন্তরীণ স্বল্প দূরত্বের নেটওয়ার্ক)। WAN = Wide Area Network (বিশ্বব্যাপী বা দেশের সীমানা ছাড়িয়ে বিস্তৃত নেটওয়ার্ক, যেমন: ইন্টারনেট)।"}, {"id": 30, "question": "সার্চ ইঞ্জিন কী? ৩টি সার্চ ইঞ্জিনের নাম লিখুন।", "answer": "সার্চ ইঞ্জিন হলো একটি বিশেষ ওয়েব প্রোগ্রাম যার মাধ্যমে ইন্টারনেটের কোটি কোটি ওয়েব পেজ থেকে প্রয়োজনীয় তথ্য খুঁজে বের করা যায়। উদাহরণ: Google, Bing, Yahoo, পিপীলিকা।"}, {"id": 31, "question": "MS Word-এ কোনো ডকুমেন্টের সব লেখা একসাথে সিলেক্ট করার কিবোর্ড শর্টকাট কী?", "answer": "Ctrl + A (Select All)"}, {"id": 32, "question": "কিবোর্ডে 'Undo' এবং 'Redo' করার শর্টকাট কমান্ড কী কী?", "answer": "Undo: Ctrl + Z এবং Redo: Ctrl + Y"}, {"id": 33, "question": "MS Word-এ বানান ও ব্যাকরণ (Spelling & Grammar) চেক করার ফাংশন কি (Function Key) কোনটি?", "answer": "F7"}, {"id": 34, "question": "কোনো ফাইল বা ফোল্ডার রিনেম (Rename) করার শর্টকাট ফাংশন কি কোনটি?", "answer": "F2"}, {"id": 35, "question": "ডকুমেন্ট 'Save As' করার জন্য কোন ফাংশন কি ব্যবহৃত হয়?", "answer": "F12"}, {"id": 36, "question": "কম্পিউটারে কোনো ফাইল স্থায়ীভাবে (Permanently) ডিলিট করার শর্টকাট কী?", "answer": "Shift + Delete (রিসাইকেল বিনে না পাঠিয়ে সরাসরি ডিলিট)"}, {"id": 37, "question": "MS Excel-এ কোনো সারির সংখ্যাগুলোর যোগফল নির্ণয়ের স্বয়ংক্রিয় ফাংশন কোনটি?", "answer": "=SUM() (যেমন: =SUM(A1:A10))"}, {"id": 38, "question": "MS Excel-এ প্রতিটি ওয়ার্কশিটে আনুভূমিক ও উল্লম্ব রেখাগুলোকে কী বলা হয়?", "answer": "রো (Row) ও কলাম (Column); এবং এদের ছেদবিন্দুকে সেল (Cell) বলে।"}, {"id": 39, "question": "কম্পিউটারের প্রধান মেমরি (Primary Memory) কোনগুলো?", "answer": "RAM (Random Access Memory) ও ROM (Read Only Memory)।"}, {"id": 40, "question": "RAM এবং ROM-এর মধ্যে প্রধান পার্থক্য কী?", "answer": "RAM হলো উদ্বায়ী (Volatile) বা বিদ্যুৎ চলে গেলে ডাটা মুছে যায়; কিন্তু ROM হলো স্থায়ী (Non-volatile) মেমরি।"}, {"id": 41, "question": "কম্পিউটারের প্রসেসরের কাজের গতি পরিমাপের একক কী?", "answer": "গিগাহার্টজ (GHz) বা মেগাহার্টজ (MHz)।"}, {"id": 42, "question": "১ গিগাবাইট (1 GB) সমান কত মেগাবাইট?", "answer": "১,০২৪ মেগাবাইট (MB)।"}, {"id": 43, "question": "LAN, MAN এবং WAN-এর পূর্ণরূপ কী?", "answer": "LAN = Local Area Network, MAN = Metropolitan Area Network, WAN = Wide Area Network।"}, {"id": 44, "question": "ইন্টারনেটের জনক কে?", "answer": "ভিন্টন জি কার্ফ (Vinton G. Cerf)।"}, {"id": 45, "question": "WWW (World Wide Web)-এর জনক কে এবং এটি কোন সালে আবিষ্কৃত হয়?", "answer": "টিম বার্নার্স-লি (Tim Berners-Lee), ১৯৮৯ সালে।"}, {"id": 46, "question": "ই-মেইল ঠিকানায় '@' চিহ্নের পরের অংশটিকে কী বলা হয়?", "answer": "ডোমেইন নেম (Domain Name), যেমন: gmail.com।"}, {"id": 47, "question": "কম্পিউটার ভাইরাস কী ধরনের সফটওয়্যার?", "answer": "একটি ক্ষতিকারক বা ধ্বংসাত্মক প্রোগ্রাম (Malicious Software / Malware)।"}, {"id": 48, "question": "ফায়ারওয়াল (Firewall)-এর প্রধান কাজ কী?", "answer": "অননুমোদিত প্রবেশাধিকার ও নেটওয়ার্ক আক্রমণ প্রতিহত করে সিস্টেম সুরক্ষিত রাখা।"}, {"id": 49, "question": "IP Address-এর পূর্ণরূপ কী এবং এটি কী কাজে লাগে?", "answer": "Internet Protocol Address; ইন্টারনেটে যুক্ত প্রতিটি ডিভাইসের অনন্য পরিচিতি বা আইডেন্টিটি হিসেবে ব্যবহৃত হয়।"}, {"id": 50, "question": "সমাজসেবা অধিদপ্তরে ভাতা বিতরণে ব্যবহৃত 'G2P' সিস্টেম কী?", "answer": "Government to Person (সরকার থেকে সরাসরি সুবিধাভোগীর মোবাইল ব্যাংকিং অ্যাকাউন্টে অর্থ পৌঁছানোর স্বয়ংক্রিয় ডিজিটাল ব্যবস্থা)।"}, {"id": 51, "question": "ডাটাবেজ ম্যানেজমেন্ট সফটওয়্যারের দুটি উদাহরণ দিন।", "answer": "Oracle, MySQL, MS Access।"}, {"id": 52, "question": "কম্পিউটার চালুর প্রক্রিয়াকে কী বলা হয়?", "answer": "বুটিং (Booting; কোল্ড বুট ও ওয়ার্ম বুট)।"}, {"id": 53, "question": "ওপেন সোর্স অপারেটিং সিস্টেমের একটি জনপ্রিয় উদাহরণ কোনটি?", "answer": "লিনাক্স (Linux)।"}, {"id": 54, "question": "PDF-এর পূর্ণরূপ কী?", "answer": "Portable Document Format।"}, {"id": 55, "question": "GUI-এর পূর্ণরূপ কী?", "answer": "Graphical User Interface।"}, {"id": 56, "question": "কম্পিউটারে ব্যবহৃত 'মাদারবোর্ড' (Motherboard)-এর কাজ কী?", "answer": "কম্পিউটারের সব হার্ডওয়্যার যন্ত্রাংশ (প্রসেসর, র‍্যাম, স্টোরেজ)-এর মধ্যে সংযোগ ও বিদ্যুৎ সঞ্চালন সমন্বয় করা।"}, {"id": 57, "question": "MS PowerPoint-এ নতুন স্লাইড যোগ করার কিবোর্ড শর্টকাট কী?", "answer": স্য দেশ ১৯৩টি (সর্বশেষ সদস্য দক্ষিণ সুদান, ২০১১)। পর্যবেক্ষক রাষ্ট্র ২টি (ভ্যাটিকান সিটি ও ফিলিস্তিন)।", "category": "আন্তর্জাতিক সংস্থা"}, {"id": 3, "question": "জাতিসংঘ নিরাপত্তা পরিষদের স্থায়ী সদস্য দেশ কোনগুলো?", "answer": "নিরাপত্তা পরিষদের ৫টি স্থায়ী সদস্য দেশ রয়েছে যাদের ভেটো (Veto) ক্ষমতা আছে: যুক্তরাষ্ট্র, যুক্তরাজ্য, ফ্রান্স, রাশিয়া এবং চীন।", "category": "আন্তর্জাতিক সংস্থা"}, {"id": 4, "question": "আন্তর্জাতিক আদালত (ICJ) কোথায় অবস্থিত এবং বিচারক সংখ্যা কত?", "answer": "নেদারল্যান্ডসের হেগ শহরে অবস্থিত। মোট বিচারক সংখ্যা ১৫ জন এবং তাদের মেয়াদ ৯ বছর।", "category": "আন্তর্জাতিক সংস্থা"}, {"id": 5, "question": "বিশ্ব স্বাস্থ্য সংস্থা (WHO) এবং আন্তর্জাতিক শ্রম সংস্থা (ILO)-এর সদর দপ্তর কোথায়?", "answer": "উভয় সংস্থার সদর দপ্তর সুইজারল্যান্ডের জেনেভা শহরে অবস্থিত।", "category": "আন্তর্জাতিক সংস্থা"}, {"id": 6, "question": "এসডিজি (SDG - Sustainable Development Goals) এর লক্ষ্যমাত্রা কয়টি এবং মেয়াদকাল কত?", "answer": "এসডিজি-র মোট অভীষ্ট/লক্ষ্য ১৭টি এবং সুনির্দিষ্ট লক্ষ্যমাত্রা ১৬৯টি। এর মেয়াদকাল ২০১৬ থেকে ২০৩০ সাল পর্যন্ত।", "category": "উন্নয়ন লক্ষ্য"}, {"id": 7, "question": "যুক্তরাজ্য কোন প্রক্রিয়ায় ইউরোপীয় ইউনিয়ন (EU) ত্যাগ করে এবং এটি কার্যকর হয় কবে?", "answer": "ব্রেক্সিট (Brexit) গণভোটের মাধ্যমে। যুক্তরাজ্য আনুষ্ঠানিকভাবে ২০২০ সালের ৩১ জানুয়ারি মধ্যরাতে ইউরোপীয় ইউনিয়ন থেকে বেরিয়ে যায়।", "category": "বৈশ্বিক রাজনীতি"}, {"id": 8, "question": "সার্ক (SAARC) এবং বিমসটেক (BIMSTEC)-এর সদর দপ্তর কোথায়?", "answer": "সার্কের সচিবালয় নেপালের কাঠমান্ডুতে এবং বিমসটেকের সচিবালয় বাংলাদেশের ঢাকায় অবস্থিত।", "category": "আঞ্চলিক জোট"}, {"id": 9, "question": "ব্রিকস (BRICS)-এর মূল প্রতিষ্ঠাতা সদস্য দেশ কোনগুলো এবং সম্প্রতি কোন দেশগুলো যুক্ত হয়েছে?", "answer": "মূল ৫টি দেশ: ব্রাজিল, রাশিয়া, ভারত, চীন ও দক্ষিণ আফ্রিকা। ২০২৪ সালের ১ জানুয়ারি নতুন সদস্য হিসেবে যুক্ত হয় মিশর, ইথিওপিয়া, ইরান ও সংযুক্ত আরব আমিরাত।", "category": "অর্থনৈতিক জোট"}, {"id": 10, "question": "ন্যাটো (NATO) কী এবং এর বর্তমান সদস্য সংখ্যা কত?", "answer": "ন্যাটো হলো উত্তর আটলান্টিক সামরিক জোট, প্রতিষ্ঠিত হয় ১৯৪৯ সালে। সদর দপ্তর বেলজিয়ামের ব্রাসেলসে। বর্তমান সদস্য সংখ্যা ৩২টি (৩১তম ফিনল্যান্ড, ৩২তম সুইডেন)।", "category": "সামরিক জোট"}, {"id": 11, "question": "আন্তর্জাতিক মুদ্রা তহবিল (IMF) এবং বিশ্বব্যাংক (World Bank)-এর সদর দপ্তর কোথায়?", "answer": "উভয় সংস্থার সদর দপ্তর যুক্তরাষ্ট্রের রাজধানী ওয়াশিংটন ডিসিতে অবস্থিত।", "category": "অর্থনৈতিক সংস্থা"}, {"id": 12, "question": "প্যারিস জলবায়ু চুক্তি কবে স্বাক্ষরিত হয় এবং এর মূল লক্ষ্য কী?", "answer": "২০১৫ সালের ১২ ডিসেম্বর কপ-২১ সম্মেলনে গৃহীত হয় এবং ২২ এপ্রিল ২০১৬ স্বাক্ষরিত হয়। মূল লক্ষ্য হলো বৈশ্বিক তাপমাত্রা বৃদ্ধি প্রাক-শিল্পায়ন যুগের তুলনায় ১.৫ থেকে ২ ডিগ্রি সেলসিয়াসের মধ্যে সীমাবদ্ধ রাখা।", "category": "পরিবেশ"}, {"id": 13, "question": "আন্তর্জাতিক রেড ক্রস কমিটি (ICRC)-এর প্রতিষ্ঠাতা কে এবং সদর দপ্তর কোথায়?", "answer": "প্রতিষ্ঠাতা জঁ হেনরি ডুনান্ট (১৮৬৩)। সদর দপ্তর সুইজারল্যান্ডের জেনেভায়। সংস্থাটি ৩ বার শান্তিতে নোবেল পুরস্কার পেয়েছে।", "category": "মানবিক সংস্থা"}, {"id": 14, "question": "বিশ্ব বাণিজ্য সংস্থা (WTO)-এর বর্তমান মহাপরিচালক কে এবং সদর দপ্তর কোথায়?", "answer": "সদর দপ্তর জেনেভা, সুইজারল্যান্ড। বর্তমান মহাপরিচালক এনগোজি ওকোনজো-আইওয়ালা (নাইজেরিয়া), যিনি প্রথম নারী ও আফ্রিকান প্রধান।", "category": "আন্তর্জাতিক বাণিজ্য"}, {"id": 15, "question": "ইউক্রেন-রাশিয়া যুদ্ধ কবে শুরু হয়?", "answer": "২০২২ সালের ২৪ ফেব্রুয়ারি রাশিয়া ইউক্রেনে পূর্ণাঙ্গ সামরিক আগ্রাসন শুরু করে।", "category": "সাম্প্রতিক সংকট"}, {"id": 16, "question": "বিশ্বের সবচেয়ে দীর্ঘতম নদী কোনটি এবং গভীরতম হ্রদ কোনটি?", "answer": "দীর্ঘতম নদী নীলনদ (আফ্রিকা) এবং পৃথিবীর গভীরতম হ্রদ বৈকাল হ্রদ (রাশিয়া)।", "category": "ভৌগোলিক তথ্য"}, {"id": 17, "question": "গ্রিনহাউস গ্যাসগুলোর মধ্যে প্রধান গ্যাস কোনটি?", "answer": "কার্বন ডাই অক্সাইড (CO2)। এছাড়া মিথেন (CH4), নাইট্রাস অক্সাইড ও জলীয় বাষ্প উল্লেখযোগ্য।", "category": "পরিবেশ"}, {"id": 18, "question": "নোবেল পুরস্কার কবে প্রবর্তিত হয় এবং কয়টি বিষয়ে দেওয়া হয়?", "answer": "আলফ্রেড নোবেলের উইলে ১৯০১ সাল থেকে ৫টি বিষয়ে এবং ১৯৬৯ সাল থেকে অর্থনীতিসহ মোট ৬টি বিষয়ে নোবেল পুরস্কার দেওয়া হয়।", "category": "পুরস্কার"}, {"id": 19, "question": "ফিলিস্তিনের বর্তমান গাজা যুদ্ধ কোন তারিখের সংঘাতের পর নতুন করে শুরু হয়?", "answer": "২০২৩ সালের ৭ অক্টোবর হামাসের 'অপারেশন আল-আকসা ফ্লাড' অভিযানের পর ইসরায়েল গাজায় ভয়াবহ সামরিক অভিযান শুরু করে।", "category": "সাম্প্রতিক সংকট"}, {"id": 20, "question": "বিশ্বের প্রথম কৃত্রিম বুদ্ধিমত্তা (AI) সংক্রান্ত পূর্ণাঙ্গ আইন পাস করে কোন সংস্থা?", "answer": "ইউরোপীয় ইউনিয়ন (EU) ২০২৪ সালের মার্চ মাসে বিশ্বের প্রথম পূর্ণাঙ্গ 'AI Act' পাস করে।", "category": "প্রযুক্তি ও আইন"}, {"id": 21, "question": "আসিয়ান (ASEAN)-এর সদর দপ্তর কোথায় এবং সদস্য সংখ্যা কত?", "answer": "সদর দপ্তর ইন্দোনেশিয়ার জাকার্তায়। বর্তমান সদস্য সংখ্যা ১০টি দেশ (ব্রুনাই, কম্বোডিয়া, ইন্দোনেশিয়া, লাওস, মালয়েশিয়া, মিয়ানমার, ফিলিপাইন, সিঙ্গাপুর, থাইল্যান্ড ও ভিয়েতনাম)।", "category": "আঞ্চলিক জোট"}, {"id": 22, "question": "আন্তর্জাতিক আনবিক শক্তি সংস্থা (IAEA)-এর সদর দপ্তর কোথায়?", "answer": "অস্ট্রিয়ার রাজধানী ভিয়েনায় অবস্থিত। এটি ১৯৫৭ সালে প্রতিষ্ঠিত হয়।", "category": "আন্তর্জাতিক সংস্থা"}, {"id": 23, "question": "ইন্টারপোল (INTERPOL)-এর পূর্ণরূপ কী এবং সদর দপ্তর কোথায়?", "answer": "পূর্ণরূপ: International Criminal Police Organization। এর সদর দপ্তর ফ্রান্সের লিওঁ (Lyon) শহরে অবস্থিত।", "category": "নিরাপত্তা সংস্থা"}, {"id": 24, "question": "ইউনেস্কো (UNESCO) এবং ওইসিডি (OECD)-এর সদর দপ্তর কোথায়?", "answer": "উভয় সংস্থার সদর দপ্তর ফ্রান্সের রাজধানী প্যারিসে অবস্থিত।", "category": "আন্তর্জাতিক সংস্থা"}, {"id": 25, "question": "জাতিসংঘ শিশু তহবিল (UNICEF)-এর সদর দপ্তর কোথায় অবস্থিত?", "answer": "যুক্তরাষ্ট্রের নিউইয়র্ক শহরে অবস্থিত। এটি ১৯৪৬ সালে প্রতিষ্ঠিত হয়।", "category": "মানবিক সংস্থা"}, {"id": 26, "question": "জাতিসংঘ শরণার্থী বিষয়ক হাইকমিশনার (UNHCR)-এর সদর দপ্তর কোথায়?", "answer": "সুইজারল্যান্ডের জেনেভায় অবস্থিত। এটি ১৯৫০ সালে প্রতিষ্ঠিত হয়।", "category": "মানবিক সংস্থা"}, {"id": 27, "question": "খাদ্য ও কৃষি সংস্থা (FAO) এবং বিশ্ব খাদ্য কর্মসূচি (WFP)-এর সদর দপ্তর কোথায়?", "answer": "উভয় সংস্থার সদর দপ্তর ইতালির রাজধানী রোমে অবস্থিত।", "category": "আন্তর্জাতিক সংস্থা"}, {"id": 28, "question": "আন্তর্জাতিক অপরাধ আদালত (ICC)-এর সদর দপ্তর কোথায় এবং এটি কোন সনদের মাধ্যমে গঠিত?", "answer": "নেদারল্যান্ডসের হেগ শহরে অবস্থিত। এটি ১৯৯৮ সালের রোম সংবিধির (Rome Statute) মাধ্যমে প্রতিষ্ঠিত এবং ২০০২ সালে কার্যকর হয়।", "category": "আন্তর্জাতিক আইন"}, {"id": 29, "question": "কমনওয়েলথ (Commonwealth)-এর প্রধান কে এবং এর সদর দপ্তর কোথায়?", "answer": "প্রধান ব্রিটিশ রাজা তৃতীয় চার্লস। এর সচিবালয় লন্ডনের মার্লবোরো হাউসে অবস্থিত। মোট সদস্য ৫৬টি দেশ।", "category": "আন্তর্জাতিক জোট"}, {"id": 30, "question": "ওপেক (OPEC)-এর সদর দপ্তর কোথায় এবং এটি কী ধরনের সংস্থা?", "answer": "অস্ট্রিয়ার রাজধানী ভিয়েনায় অবস্থিত। এটি তেল রপ্তানিকারক দেশগুলোর একটি আন্তর্জাতিক সংস্থা, প্রতিষ্ঠিত হয় ১৯৬০ সালে বাগদাদে।", "category": "অর্থনৈতিক সংস্থা"}, {"id": 31, "question": "জি-৭ (G7) জোটভুক্ত দেশগুলো কোনগুলো?", "answer": "৭টি শীর্ষ শিল্পোন্নত দেশ: যুক্তরাষ্ট্র, যুক্তরাজ্য, কানাডা, ফ্রান্স, জার্মানি, ইতালি এবং জাপান।", "category": "অর্থনৈতিক জোট"}, {"id": 32, "question": "জি-২০ (G20)-এর সর্বশেষ স্থায়ী নতুন সদস্য হিসেবে কোন সংস্থা যুক্ত হয়েছে?", "answer": "আফ্রিকান ইউনিয়ন (African Union - AU) ২০২৩ সালের নয়াদিল্লি সম্মেলনে জি-২০ এর ২১তম পূর্ণাঙ্গ সদস্য হিসেবে যুক্ত হয়।", "category": "অর্থনৈতিক জোট"}, {"id": 33, "question": "সুয়েজ খাল কোন দুটি সাগরকে সংযুক্ত করেছে এবং পানামা খাল কোন দুটি মহাসাগরকে?", "answer": "সুয়েজ খাল ভূমধ্যসাগর ও লোহিত সাগরকে যুক্ত করেছে। পানামা খাল আটলান্টিক ও প্রশান্ত মহাসাগরকে যুক্ত করেছে।", "category": "ভৌগোলিক তথ্য"}, {"id": 34, "question": "মালাক্কা প্রণালী কোন দুটি জলভাগকে যুক্ত করেছে?", "answer": "আন্দামান সাগর (ভারত মহাসাগর) ও দক্ষিণ চীন সাগরকে যুক্ত করেছে (মালয়েশিয়া ও ইন্দোনেশিয়াকে পৃথক করেছে)।", "category": "ভৌগোলিক তথ্য"}, {"id": 35, "question": "জলবায়ু সংক্রান্ত শীর্ষ সম্মেলন 'কপ' (COP)-এর পূর্ণরূপ কী এবং কপ-২৮ কোথায় অনুষ্ঠিত হয়?", "answer": "Conference of the Parties। কপ-২৮ সম্মেলন অনুষ্ঠিত হয় ২০২৩ সালে সংযুক্ত     function changeBookFontSize(sizeVal) {
      const sizeNum = parseFloat(sizeVal) || 16.5;
      const sizePx = sizeNum + 'px';
      document.documentElement.style.setProperty('--base-font-size', sizePx);
      document.documentElement.style.fontSize = sizePx;

      localStorage.setItem('ss_chosen_font_size', sizeVal);
      const sel = document.getElementById('bookFontSizeSelectDropdown');

        text.innerText = '১-কলাম মোড';
      } else {
        stream.classList.remove('two-column');
        btn.classList.remove('active');
        text.innerText = '২-কলাম মোড';
      }
    }

    function toggleColumnMode() {
      isTwoColumn = !isTwoColumn;
      localStorage.setItem('ss_two_column_mode', isTwoColumn ? 'true' : 'false');
      applyColumnMode();
    }

    function applyPracticeModeButton() {
      const btn = document.getElementById('togglePracticeBtn');
      const text = document.getElementById('practiceBtnText');
      if (!btn || !text) return;

      if (isPracticeMode) {
        btn.classList.add('active');
        text.innerText = 'উত্তর দেখান';
      } else {
        btn.classList.remove('active');
        text.innerText = 'উত্তর লুকান';
      }
    }

    function togglePracticeMode() {
      isPracticeMode = !isPracticeMode;
      localStorage.setItem('ss_practice_mode', isPracticeMode ? 'true' : 'false');
      applyPracticeModeButton();
      renderBookPage();
    }

    function toggleAnswer(answerElementId) {
      if (!isPracticeMode) return;
      const el = document.getElementById(answerElementId);
      if (!el) return;
      el.classList.toggle('revealed');
    }

    function applyBookmarkFilterButton() {
      const btn = document.getElementById('toggleBookmarkFilterBtn');
      const text = document.getElementById('bookmarkFilterText');
      if (!btn || !text) return;

      if (onlyBookmarks) {
        btn.classList.add('active');
        text.innerText = 'সব প্রশ্ন';
      } else {
        btn.classList.remove('active');
        text.innerText = 'বুকমার্ক দেখা';
      }
    }

    function toggleBookmarkFilter() {
      onlyBookmarks = !onlyBookmarks;
      localStorage.setItem('ss_only_bookmarks', onlyBookmarks ? 'true' : 'false');
      applyBookmarkFilterButton();
      renderBookPage();
    }

    function handleSearch() {
      searchQuery = document.getElementById('bookSearchInput').value.trim().toLowerCase();
      renderBookPage();
    }

    function toggleBookmark(uniqueKey) {
      const idx = bookmarkedIds.indexOf(uniqueKey);
      if (idx > -1) {
        bookmarkedIds.splice(idx, 1);
      } else {
        bookmarkedIds.push(uniqueKey);
      }
      localStorage.setItem('ss_book_bookmarks', JSON.stringify(bookmarkedIds));
      updateBookmarkStats();
      renderBookPage();
    }

    function updateBookmarkStats() {
      const badge = document.getElementById('footerBookmarkCounter');
      if (badge) {
        badge.innerText = `বুকমার্ক: ${toBnNum(bookmarkedIds.length)} টি`;
      }
    }

    function selectSubject(key) {
      currentSubject = key;
      localStorage.setItem('ss_chosen_subject', key);

      const topics = Object.keys(APP_DATA[currentSubject] || {});
      const savedTopicForSubj = localStorage.getItem('ss_chosen_topic_' + key);
      if (savedTopicForSubj && topics.includes(savedTopicForSubj)) {
        currentTopic = savedTopicForSubj;
      } else {
        currentTopic = topics.length > 0 ? topics[0] : '';
      }
      localStorage.setItem('ss_chosen_topic', currentTopic);

      searchQuery = '';
      const sInput = document.getElementById('bookSearchInput');
      if (sInput) sInput.value = '';

      renderSubjectTabs();
      renderTopicSubnav();
      renderBookPage();
    }

    function renderSubjectTabs() {
      const container = document.getElementById('subjectTabsContainer');
      container.innerHTML = '';

      Object.keys(SUBJECT_METADATA).forEach(key => {
        const meta = SUBJECT_METADATA[key];
        const isActive = key === currentSubject;

        const btn = document.createElement('button');
        btn.className = `subject-tab ${isActive ? 'active' : ''}`;
        btn.innerText = `${meta.name} (${meta.marks})`;
        btn.onclick = () => selectSubject(key);
        container.appendChild(btn);
      });
    }

    function selectTopic(key) {
      currentTopic = key;
      localStorage.setItem('ss_chosen_topic', key);
      localStorage.setItem('ss_chosen_topic_' + currentSubject, key);

      searchQuery = '';
      const sInput = document.getElementById('bookSearchInput');
      if (sInput) sInput.value = '';

      renderTopicSubnav();
      renderBookPage();
    }

    function renderTopicSubnav() {
      const container = document.getElementById('topicsSubnavContainer');
      container.innerHTML = '';

      const topics = APP_DATA[currentSubject];
      Object.keys(topics).forEach(key => {
        const tData = topics[key];
        const isActive = key === currentTopic;

        const btn = document.createElement('button');
        btn.className = `topic-link ${isActive ? 'active' : ''}`;
        const count = tData.items ? tData.items.length : 0;
        const numStr = currentSubject === 'English' ? count : toBnNum(count);
        
        let rawTopic = tData.topic || key;
        let cleanTopic = rawTopic.replace(/\s*\([০-৯0-9]+টি\s*মাস্টার\s*সেট\)/g, '').trim();

        btn.innerHTML = `
          <span>${cleanTopic}</span>
          <span class="topic-pill-count">${numStr}</span>
        `;
        btn.onclick = () => selectTopic(key);
        container.appendChild(btn);
      });
    }

    function initApp() {
      // 1. Restore Font Family
      const savedFont = localStorage.getItem('ss_chosen_font') || "'Noto Sans Bengali', sans-serif";
      changeBookFont(savedFont);
      const selFont = document.getElementById('bookFontSelectDropdown');
      if (selFont) selFont.value = savedFont;

      // 2. Restore Font Size
      const savedFontSize = localStorage.getItem('ss_chosen_font_size') || '16.5';
      changeBookFontSize(savedFontSize);

      // 3. Restore Selected Subject
      const savedSubject = localStorage.getItem('ss_chosen_subject');
      if (savedSubject && APP_DATA[savedSubject]) {
        currentSubject = savedSubject;
      }

      // 4. Restore Selected Topic
      const topics = Object.keys(APP_DATA[currentSubject] || {});
      const savedTopic = localStorage.getItem('ss_chosen_topic');
      if (savedTopic && topics.includes(savedTopic)) {
        currentTopic = savedTopic;
      } else if (topics.length > 0) {
        currentTopic = topics[0];
      }

      // 5. Restore Two-Column Mode
      isTwoColumn = localStorage.getItem('ss_two_column_mode') === 'true';
      applyColumnMode();

      // 6. Restore Practice / Hide Answer Mode
      isPracticeMode = localStorage.getItem('ss_practice_mode') === 'true';
      applyPracticeModeButton();

      // 7. Restore Only Bookmarks Filter
      onlyBookmarks = localStorage.getItem('ss_only_bookmarks') === 'true';
      applyBookmarkFilterButton();

      // 8. Initial Render
      updateBookmarkStats();
      renderSubjectTabs();
      renderTopicSubnav();
      renderBookPage();
    }

    function renderBookPage() {
      const subMeta = SUBJECT_METADATA[currentSubject];
      const topicData = APP_DATA[currentSubject][currentTopic] || { items: [] };

      // Running Headers
      document.getElementById('runningChapterName').innerText = subMeta.runningName;
      document.getElementById('runningMarksBadge').innerText = `পূর্ণমান: ${subMeta.marks}`;

      // Chapter Titles
      document.getElementById('chapterCategoryBadge').innerText = subMeta.category;
      document.getElementById('chapterHeading').innerText = topicData.topic || currentTopic;
      document.getElementById('chapterDescription').innerText = topicData.description || 'লিখিত পরীক্ষার জন্য প্রমিত পাঠ ও সমাধান।';
      document.getElementById('chapterExamTip').innerText = topicData.exam_tip || 'পরীক্ষার খাতায় লেখার নিয়ম ও প্রমিত উপস্থাপনা।';

      const container = document.getElementById('bookContentStream');
      let items = topicData.items || [];

      // Filter by search
      if (searchQuery) {
        items = items.filter(item => {
          const str = JSON.stringify(item).toLowerCase();
          return str.includes(searchQuery);
        });
      }

      // Filter by bookmark
      if (onlyBookmarks) {
        items = items.filter((item, idx) => {
          const uniqueKey = `${currentSubject}_${currentTopic}_${item.id || idx}`;
          return bookmarkedIds.includes(uniqueKey);
        });
      }

      // Footer Stats
      const totalNumStr = currentSubject === 'English' ? items.length : toBnNum(items.length);
      document.getElementById('footerItemCounter').innerText = `মোট আইটেম: ${totalNumStr} টি`;

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-book-state">
            <h3>কোনো প্রশ্ন পাওয়া যায়নি</h3>
            <p>অনুসন্ধান ফিল্টার পরিবর্তন করে পুনরায় চেষ্টা করুন।</p>
          </div>
        `;
        return;
      }

      // Essays / Paragraphs / Applications render in full-width single column
      if (currentTopic === 'bhabsomprosharon_onucched' || currentTopic === 'paragraph' || currentTopic === 'abedonpotro_dorkhasht' || currentTopic === 'formal_letter_application') {
        container.className = 'book-content-stream';
        container.innerHTML = items.map((item, idx) => renderEssayBookEntry(item, idx)).join('');
      } else {
        container.className = isTwoColumn ? 'book-content-stream two-column' : 'book-content-stream';
        container.innerHTML = items.map((item, idx) => renderBookEntry(item, idx)).join('');
      }
    }

      const numLabel = isEnglish ? `${idx + 1}.` : `${toBnNum(idx + 1)}।`;
      const title = item.title || item.topic;
      const content = item.model_answer || item.model_paragraph;

      return `
        <div class="essay-book-box">
          <div class="entry-header-row ${isPracticeMode ? 'practice-clickable' : ''}" ${isPracticeMode ? `onclick="toggleAnswer('${answerElementId}')" title="ক্লিক করে লেখা দেখুন/লুকান"` : ''}>
            <h2 class="essay-book-title">${numLabel} "${title}"</h2>
            <button class="entry-bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="event.stopPropagation(); toggleBookmark('${uniqueKey}')" title="বুকমার্ক">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="${isBookmarked ? '#d97706' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>
          </div>

          <div class="${hiddenClass}" id="${answerElementId}" onclick="if(isPracticeMode) this.classList.remove('revealed')">
            ${item.key_points ? `<div class="essay-book-points">পয়েন্ট ও মূল ধারণা: ${item.key_points}</div>` : ''}
            <div class="essay-book-body ${isEnglish ? 'en' : ''}">
              ${content}
            </div>
          </div>
        </div>
      `;
    }

    // Boot Book App
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
