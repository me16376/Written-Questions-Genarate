on": "I look forward to (hear) from you soon.", "answer": "hearing", "rule": "'Look forward to' takes V-ing."}, {"id": 7, "question": "He went to the library with a view to (read) books.", "answer": "reading", "rule": "'With a view to' takes V-ing."}, {"id": 8, "question": "Scarcely had the teacher entered the room when the students (stand) up.", "answer": "stood", "rule": "Scarcely had ... when + past indefinite."}, {"id": 9, "question": "No sooner had he seen the police than he (run) away.", "answer": "ran", "rule": "No sooner had ... than + past indefinite."}, {"id": 10, "question": "Neither of the two boys (be) present.", "answer": "was / is", "rule": "Neither of + plural noun takes singular verb."}, {"id": 11, "question": "The jury (be) unanimous in their opinion.", "answer": "was", "rule": "Collective noun unanimous takes singular verb."}, {"id": 12, "question": "The jury (be) divided in their opinions.", "answer": "were", "rule": "Noun of multitude takes plural verb."}, {"id": 13, "question": "One of the boys (be) absent yesterday.", "answer": "was", "rule": "'One of the' takes singular verb."}, {"id": 14, "question": "The quality of these mangoes (be) not good.", "answer": "is / was", "rule": "Agrees with head noun 'quality' (singular)."}, {"id": 15, "question": "Bread and butter (be) his favorite breakfast.", "answer": "is", "rule": "Compound noun forming a single unit takes singular."}, {"id": 16, "question": "Slow and steady (win) the race.", "answer": "wins", "rule": "Singular idea takes singular verb."}, {"id": 17, "question": "Ten miles (be) a long distance to walk.", "answer": "is", "rule": "Distance, money, time measurements take singular verb."}, {"id": 18, "question": "If you came, I (go).", "answer": "would go", "rule": "Second conditional: If + past indefinite, would + V1."}, {"id": 19, "question": "If he had studied hard, he (pass) the exam.", "answer": "would have passed", "rule": "Third conditional: If + past perfect, would have + V3."}, {"id": 20, "question": "Had I seen him, I (tell) him the news.", "answer": "would have told", "rule": "Inverted third conditional: Had + S + V3, would have + V3."}, {"id": 21, "question": "He has just (finish) his assignment.", "answer": "finished", "rule": "Just, already take Present Perfect (has/have + V3)."}, {"id": 22, "question": "I would rather starve than (beg).", "answer": "beg", "rule": "'Would rather' takes bare infinitive."}, {"id": 23, "question": "You had better (leave) the place right now.", "answer": "leave", "rule": "'Had better' takes bare infinitive."}, {"id": 24, "question": "I saw the boy (play) in the field.", "answer": "playing", "rule": "Sensory verbs take participle for continuous action."}, {"id": 25, "question": "The earth (move) round the sun.", "answer": "moves", "rule": "Universal truth takes Present Indefinite."}, {"id": 26, "question": "He talked as though he (know) everything.", "answer": "had known", "rule": "Past + as though + Past Perfect."}, {"id": 27, "question": "I wish I (be) a king.", "answer": "were", "rule": "Unreal wish takes 'were'."}, {"id": 28, "question": "The train had started before I (reach) the station.", "answer": "reached", "rule": "Before clause in past perfect takes Simple Past."}, {"id": 29, "question": "While (walk) in the garden, a snake bit him.", "answer": "walking", "rule": "'While' directly before verb takes -ing."}, {"id": 30, "question": "While he (walk) in the morning, he saw an accident.", "answer": "was walking", "rule": "'While' + subject takes Past Continuous."}, {"id": 31, "question": "It (rain) since morning.", "answer": "has been raining", "rule": "Present Perfect Continuous with 'since'."}, {"id": 32, "question": "The bell (ring) before the teacher entered.", "answer": "had rung", "rule": "Past Perfect before 'before'."}, {"id": 33, "question": "He cannot help (laugh) at the funny joke.", "answer": "laughing", "rule": "'Cannot help' takes V-ing."}, {"id": 34, "question": "Do not get down from a (run) train.", "answer": "running", "rule": "Participle used as adjective."}, {"id": 35, "question": "The letter was (write) by him yesterday.", "answer": "written", "rule": "Passive voice: was/were + V3."}, {"id": 36, "question": "He made me (do) the work.", "answer": "do", "rule": "Causative 'make' takes bare infinitive in active voice."}, {"id": 37, "question": "I was made (do) the work by him.", "answer": "to do", "rule": "Causative 'make' in passive voice takes full infinitive ('to do')."}, {"id": 38, "question": "The patient died after the doctor (come).", "answer": "had come", "rule": "After clause takes Past Perfect."}, {"id": 39, "question": "Each of the students (receive) a medal.", "answer": "receives / received", "rule": "'Each of' takes a singular verb."}, {"id": 40, "question": "Fifty thousand dollars (be) a large sum of money.", "answer": "is", "rule": "Total sum of money takes singular verb."}, {"id": 41, "question": "The news (be) true.", "answer": "is", "rule": "'News' is singular."}, {"id": 42, "question": "The United States (be) a powerful country.", "answer": "is", "rule": "Country names ending in 's' take singular verb."}, {"id": 43, "question": "Water (freeze) at 0 degree Celsius.", "answer": "freezes", "rule": "Scientific fact takes Present Indefinite."}, {"id": 44, "question": "Had you invited me, I (attend) the function.", "answer": "would have attended", "rule": "Third conditional structure."}, {"id": 45, "question": "Lest he should (fail), he worked hard.", "answer": "fail", "rule": "'Lest' + subject + should/might + base verb."}, {"id": 46, "question": "Run fast lest you (miss) the train.", "answer": "should miss", "rule": "'Lest' takes 'should + V1'."}, {"id": 47, "question": "He (live) in Dhaka for five years.", "answer": "has been living", "rule": "Action continuing over a period takes Present Perfect Continuous."}, {"id": 48, "question": "The virtuous (be) always happy.", "answer": "are", "rule": "'The' + adjective representing plural class takes plural verb."}, {"id": 49, "question": "By this time tomorrow, I (reach) my village.", "answer": "will have reached", "rule": "Future perfect: 'By + future time' requires will have + V3."}, {"id": 50, "question": "Let him (do) whatever he likes.", "answer": "do", "rule": "After 'let', bare infinitive is used."}, {"id": 51, "question": "The mother made the baby (drink) the milk.", "answer": "drink", "rule": "Causative verb 'make' takes bare infinitive."}, {"id": 52, "question": "I had my car (repair) yesterday.", "answer": "repaired", "rule": "Causative 'have' with passive object takes V3."}, {"id": 53, "question": "He got his hair (cut) at the salon.", "answer": "cut", "rule": "Causative 'get' with passive object takes V3."}, {"id": 54, "question": "I cannot help (shed) tears at his grief.", "answer": "shedding", "rule": "'Cannot help' takes V-ing."}, {"id": 55, "question": "He went away (weep).", "answer": "weeping", "rule": "Participle denoting manner."}, {"id": 56, "question": "Would you mind (open) the window?", "answer": "opening", "rule": "'Would you mind' is followed by gerund."}, {"id": 57, "question": "It is no use (cry) over spilt milk.", "answer": "crying", "rule": "'It is no use' + gerund."}, {"id": 58, "question": "There is no harm in (try) again.", "answer": "trying", "rule": "Preposition 'in' followed by gerund."}, {"id": 59, "question": "He gave up (smoke) last month.", "answer": "smoking", "rule": "Phrasal verb followed by gerund."}, {"id": 60, "question": "He avoided (meet) the landlord.", "answer": "meeting", "rule": "Verb 'avoid' takes gerund."}, {"id": 61, "question": "He admitted (steal) the watch.", "answer": "stealing", "rule": "'Admit' takes gerund."}, {"id": 62, "question": "I finished (write) the essay just now.", "answer": "writing", "rule": "'Finish' takes gerund."}, {"id": 63, "question": "The boy was punished for (tell) a lie.", "answer": "telling", "rule": "Preposition 'for' takes gerund."}, {"id": 64, "question": "He insisted on (go) with us.", "answer": "going", "rule": "Preposition 'on' takes gerund."}, {"id": 65, "question": "He is fond of (read) historical novels.", "answer": "reading", "rule": "Preposition 'of' takes gerund."}, {"id": 66, "question": "I prevented him from (fall).", "answer": "falling", "rule": "Preposition 'from' takes gerund."}, {"id": 67, "question": "He succeeded in (secure) the first prize.", "answer": "securing", "rule": "Preposition 'in' takes gerund."}, {"id": 68, "question": "He went home after he (complete) his shift.", "answer": "had completed", "rule": "'After' clause in past takes Past Perfect."}, {"id": 69, "question": "Before the doctor came, the patient (die).", "answer": "had died", "rule": "Action completed before another past action takes Past Perfect."}, {"id": 70, "question": "Since 2010, they (live) in this neighborhood.", "answer": "have been living", "rule": "Action continuing from past takes Present Perfect Continuous."}, {"id": 71, "question": "By the end of this year, he (serve) the office for twenty years.", "answer": "will have served", "rule": "Future Perfect Tense."}, {"id": 72, "question": "If you had told me earlier, I (help) you.", "answer": "would have helped", "rule": "Third conditional: would have + V3."}, {"id": 73, "question": "Had I known his address, I (write) to him.", "answer": "would have written", "rule": "Inverted conditional: would have + V3."}, {"id": 74, "question": "Unless you work hard, you (fail).", "answer": "will fail", "rule": "First conditional with unless."}, {"id": 75, "question": "He walks fast as though he (be) in a hurry.", "answer": "were", "rule": "'As though' takes 'were' for be-verb."}, {"id": 76, "question": "He stopped (write) when the bell rang.", "answer": "writing", "rule": "Stop + gerund for terminating action."}, {"id": 77, "question": "The house needs (paint).", "answer": "painting / to be painted", "rule": "Need + gerund in passive sense."}, {"id": 78, "question": "I cannot help (pity) the poor child.", "answer": "pitying", "rule": "'Cannot help' takes V-ing."}, {"id": 79, "question": "He preferred reading to (write).", "answer": "writing", "rule": "Preposition 'to' after prefer takes V-ing."}, {"id": 80, "question": "He had better (consult) an expert physician.", "answer": "consult", "rule": "'Had better' takes bare infinitive."}, {"id": 81, "question": "It is many years since I (meet) him.", "answer": "met", "rule": "Present + since + Past Indefinite."}, {"id": 82, "question": "Many years had passed since we first (meet).", "answer": "met", "rule": "Past Perfect + since + Past Indefinite."}, {"id": 83, "question": "He walked slowly lest he (stumble).", "answer": "should stumble", "rule": "'Lest' takes 'should + V1'."}, {"id": 84, "question": "I wish I (have) a car.", "answer": "had", "rule": "Unreal present wish takes Past Indefinite."}, {"id": 85, "question": "The principal desired that the meeting (be) postponed.", "answer": "be", "rule": "Subjunctive mood takes base verb 'be'."}, {"id": 86, "question": "Hardly had he reached the stop when the bus (leave).", "answer": "left", "rule": "Hardly had ... when + past indefinite."}, {"id": 87, "question": "The thief was seen (enter) the building.", "answer": "entering / to enter", "rule": "Passive perception verb."}, {"id": 88, "question": "He spent the whole afternoon (play) chess.", "answer": "playing", "rule": "Spend time + V-ing."}, {"id": 89, "question": "I would rather die than (surrender).", "answer": "surrender", "rule": "'Would rather' takes bare infinitive."}, {"id": 90, "question": "If you boil water to 100 degrees, it (evaporate).", "answer": "evaporates", "rule": "Zero conditional scientific fact."}]}, "sentence_correction": {"subject": "English", "subject_code": "english", "topic": "Sentence Correction & Common Errors (60 Master Sets)", "topic_code": "sentence_correction", "mark_distribution": "3 – 5 Marks", "exam_tips": "Common errors in written exams test Subject-Verb Agreement, Pronoun Cases, Prepositional idioms, Parallelism, and Uncountable Nouns.", "total_items": 40, "items": [{"id": 1, "incorrect": "He is senior than me.", "correct": "He is senior to me.", "rule": "Latin adjectives ending in -ior (senior, junior, prior, superior, inferior) take 'to', not 'than'."}, {"id": 2, "incorrect": "One of the boy is absent today.", "correct": "One of the boys is absent today.", "rule": "'One of the' is always followed by a plural noun and a singular verb."}, {"id": 3, "incorrect": "He gave me an advice.", "correct": "He gave me a piece of advice. (or: some advice)", "rule": "'Advice' is an uncountable noun and cannot be preceded directly by 'a' or 'an'."}, {"id": 4, "incorrect": "I prefer reading than writing.", "correct": "I prefer reading to writing.", "rule": "'Prefer' takes the preposition 'to' when comparing two actions or things."}, {"id": 5, "incorrect": "The sceneries of Cox's Bazar are charming.", "correct": "The scenery of Cox's Bazar is charming.", "rule": "'Scenery' is uncountable; it has no plural form 'sceneries'."}, {"id": 6, "incorrect": "Neither Rahim nor his friends was present.", "correct": "Neither Rahim nor his friends were present.", "rule": "In 'Neither... nor', the verb agrees with the subject closest to it (friends -> were)."}, {"id": 7, "incorrect": "Each of the students have done their homework.", "correct": "Each of the students has done his/her homework.", "rule": "'Each of' takes a singular verb and singular pronoun."}, {"id": 8, "incorrect": "He died from cancer.", "correct": "He died of cancer.", "rule": "When someone dies of a disease, the preposition 'of' is used (died of malaria/cancer)."}, {"id": 9, "incorrect": "I, you and he are friends.", "correct": "You, he and I are friends.", "rule": "In normal statements, pronouns follow the 2nd, 3rd, 1st person order (2-3-1 rule)."}, {"id": 10, "incorrect": "You, he and I are guilty.", "correct": "I, you and he are guilty.", "rule": "When confessing a mistake or guilt, the order is 1st, 2nd, 3rd person (1-2-3 rule)."}, {"id": 11, "incorrect": "The news are true.", "correct": "The news is true.", "rule": "'News' looks plural but takes a singular verb."}, {"id": 12, "incorrect": "Fifty miles are a long distance.", "correct": "Fifty miles is a long distance.", "rule": "Units of measurement, distance, time, and money take singular verbs when considered as a whole."}, {"id": 13, "incorrect": "He is good in English.", "correct": "He is good at English.", "rule": "'Good at' means skilled or proficient in a subject."}, {"id": 14, "incorrect": "I saw a dream last night.", "correct": "I had a dream last night. (or: dreamt a dream)", "rule": "You do not 'see' a dream in English; you 'have' or 'dream' a dream."}, {"id": 15, "incorrect": "He prevented me to go there.", "correct": "He prevented me from going there.", "rule": "'Prevent' takes 'from + verb-ing', not the infinitive 'to go'."}, {"id": 16, "incorrect": "Unless you do not work hard, you will fail.", "correct": "Unless you work hard, you will fail.", "rule": "'Unless' is already negative; do not use 'not' inside an unless-clause."}, {"id": 17, "incorrect": "He insisted me to go.", "correct": "He insisted on my going.", "rule": "'Insist' takes the preposition 'on' followed by a gerund with a possessive pronoun."}, {"id": 18, "incorrect": "The patient died before the doctor came.", "correct": "The patient had died before the doctor came.", "rule": "In past perfect with 'before', the earlier action takes 'had + past participle'."}, {"id": 19, "incorrect": "He discussed about the matter.", "correct": "He discussed the matter.", "rule": "'Discuss' is a transitive verb; it does not take the preposition 'about'."}, {"id": 20, "incorrect": "I look forward to hear from you.", "correct": "I look forward to hearing from you.", "rule": "'Look forward to' is followed by a gerund (verb+ing)."}, {"id": 21, "incorrect": "He came here with a view to learn English.", "correct": "He came here with a view to learning English.", "rule": "'With a view to' is always followed by a gerund (V-ing)."}, {"id": 22, "incorrect": "Do you know who did break the glass?", "correct": "Do you know who broke the glass?", "rule": "In indirect questions, auxiliary 'did' is not used."}, {"id": 23, "incorrect": "He is suffering from fever since Monday.", "correct": "He has been suffering from fever since Monday.", "rule": "An action starting in the past and continuing takes Present Perfect Continuous tense."}, {"id": 24, "incorrect": "I reached to the station in time.", "correct": "I reached the station in time.", "rule": "'Reach' takes a direct object without the preposition 'to'."}, {"id": 25, "incorrect": "He is very weak that he cannot walk.", "correct": "He is so weak that he cannot walk.", "rule": "The correlative conjunction is 'so... that', not 'very... that'."}, {"id": 26, "incorrect": "No sooner did the bell ring when the students entered.", "correct": "No sooner did the bell ring than the students entered.", "rule": "'No sooner... than' is the correct correlative pair."}, {"id": 27, "incorrect": "Hardly had I arrived than it began to rain.", "correct": "Hardly had I arrived when it began to rain.", "rule": "'Hardly had... when' is the correct correlative pair."}, {"id": 28, "incorrect": "He told that he was ill.", "correct": "He said that he was ill. (or: He told me that he was ill)", "rule": "'Tell' requires a personal object (told me), while 'say' does not."}, {"id": 29, "incorrect": "He is addict to gambling.", "correct": "He is addicted to gambling.", "rule": "'Addicted to' is the correct adjective form meaning dependent on a bad habit."}, {"id": 30, "incorrect": "All that glitters are not gold.", "correct": "All that glitters is not gold.", "rule": "Proverb: 'All that glitters is not gold' takes a singular verb."}, {"id": 31, "incorrect": "He is taller between the two boys.", "correct": "He is the taller of the two boys.", "rule": "When comparing two specific items with 'of the two', use 'the + comparative'."}, {"id": 32, "incorrect": "I forbade him not to go.", "correct": "I forbade him to go.", "rule": "'Forbid' is inherently negative; do not add 'not' after it."}, {"id": 33, "incorrect": "He is superior than all of us.", "correct": "He is superior to all of us.", "rule": "'Superior' takes 'to', never 'than'."}, {"id": 34, "incorrect": "The climate of Sylhet is better than Dhaka.", "correct": "The climate of Sylhet is better than that of Dhaka.", "rule": "Comparisons must compare similar things: climate with climate ('that of Dhaka')."}, {"id": 35, "incorrect": "I have no money in my pocket.", "correct": "I have no money with me. (or: I have no money in hand)", "rule": "Proper idiomatic English expression for having cash."}, {"id": 36, "incorrect": "He resigned from his post.", "correct": "He resigned his post.", "rule": "'Resign' directly takes the post as its object without 'from'."}, {"id": 37, "incorrect": "What is the time in your watch?", "correct": "What is the time by your watch?", "rule": "The correct preposition for checking time with a watch is 'by'."}, {"id": 38, "incorrect": "He entered into the room.", "correct": "He entered the room.", "rule": "For physical entry, 'enter' does not take 'into'. ('Enter into' is only used for agreements)."}, {"id": 39, "incorrect": "I am looking for a work.", "correct": "I am looking for a job. (or: looking for work)", "rule": "'Work' is uncountable; use 'job' if using the article 'a'."}, {"id": 40, "incorrect": "Both of them did not come.", "correct": "Neither of them came.", "rule": "To express negative for both, use 'Neither of them came' instead of 'Both did not'."}]}, "transformation_voice": {"subject": "English", "subject_code": "EN-06", "topic": "Transformation & Voice Change", "topic_en": "Sentence Transformation & Voice Change", "total_items": 75, "description": "Voice change, Degree of comparison, Simple-Complex-Compound, Affirmative-Negative transformation.", "exam_tip": "Always write the full transformed sentence clearly maintaining the original tense.", "items": [{"id": 1, "question": "Do the work at once. (Passive)", "answer": "Let the work be done at once.", "rule": "Voice Change (Imperative)"}, {"id": 2, "question": "He pleases us all. (Passive)", "answer": "We all are pleased with him.", "rule": "Voice Change (Pleased with)"}, {"id": 3, "question": "Who wrote the book Hamlet? (Passive)", "answer": "By whom was the book Hamlet written?", "rule": "Voice Change (Interrogative 'Who')"}, {"id": 4, "question": "The police arrested the thief. (Passive)", "answer": "The thief was arrested (by the police).", "rule": "Voice Change (Past Indefinite)"}, {"id": 5, "question": "A storm destroyed the village. (Passive)", "answer": "The village was destroyed by a storm.", "rule": "Voice Change (Past Indefinite)"}, {"id": 6, "question": "They are playing football in the field. (Passive)", "answer": "Football is being played in the field by them.", "rule": "Voice Change (Present Continuous)"}, {"id": 7, "question": "He had completed the project before deadline. (Passive)", "answer": "The project had been completed by him before deadline.", "rule": "Voice Change (Past Perfect)"}, {"id": 8, "question": "Never tell a lie. (Passive)", "answer": "Let not a lie ever be told.", "rule": "Voice Change (Negative Imperative)"}, {"id": 9, "question": "We must respect our teachers. (Passive)", "answer": "Our teachers must be respected by us.", "rule": "Voice Change (Modal Auxiliary)"}, {"id": 10, "question": "Smoke filled the hall. (Passive)", "answer": "The hall was filled with smoke.", "rule": "Voice Change (Filled with)"}, {"id": 11, "question": "His conduct shocked me. (Passive)", "answer": "I was shocked at his conduct.", "rule": "Voice Change (Shocked at)"}, {"id": 12, "question": "Rice sells cheap. (Passive)", "answer": "Rice is cheap when it is sold.", "rule": "Voice Change (Quasi-passive)"}, {"id": 13, "question": "The flower smells sweet. (Passive)", "answer": "The flower is sweet when it is smelt.", "rule": "Voice Change (Quasi-passive)"}, {"id": 14, "question": "Panic seized the crowd. (Passive)", "answer": "The crowd was seized with panic.", "rule": "Voice Change (Seized with)"}, {"id": 15, "question": "Someone has stolen my pen. (Passive)", "answer": "My pen has been stolen.", "rule": "Voice Change (Indefinite pronoun omitted)"}, {"id": 16, "question": "I know him well. (Passive)", "answer": "He is well known to me.", "rule": "Voice Change (Known to)"}, {"id": 17, "question": "People speak English all over the world. (Passive)", "answer": "English is spoken all over the world.", "rule": "Voice Change (General subject omitted)"}, {"id": 18, "question": "Write a letter to your mother. (Passive)", "answer": "Let a letter be written to your mother.", "rule": "Voice Change (Imperative)"}, {"id": 19, "question": "Did you see the accident? (Passive)", "answer": "Was the accident seen by you?", "rule": "Voice Change (Interrogative Past)"}, {"id": 20, "question": "One should keep one's promise. (Passive)", "answer": "A promise should be kept.", "rule": "Voice Change (Impersonal)"}, {"id": 21, "question": "Man is mortal. (Negative)", "answer": "No man is immortal. / Man cannot but die.", "rule": "Affirmative to Negative"}, {"id": 22, "question": "Only Allah can help us. (Negative)", "answer": "None but Allah can help us.", "rule": "Only (Person/Creator) → None but"}, {"id": 23, "question": "He has only a few books. (Negative)", "answer": "He has not many books.", "rule": "Only a few → Not many"}, {"id": 24, "question": "Every mother loves her child. (Negative)", "answer": "There is no mother but loves her child.", "rule": "Every → There is no ... but"}, {"id": 25, "question": "As soon as the thief saw the police, he fled. (Negative)", "answer": "No sooner had the thief seen the police than he fled.", "rule": "As soon as → No sooner had ... than"}, {"id": 26, "question": "He is too weak to walk. (Negative)", "answer": "He is so weak that he cannot walk.", "rule": "Too ... to → So ... that ... cannot"}, {"id": 27, "question": "I must do the work. (Negative)", "answer": "I cannot but do the work. / I cannot help doing the work.", "rule": "Must → Cannot but"}, {"id": 28, "question": "He is both honest and hardworking. (Negative)", "answer": "He is not only honest but also hardworking.", "rule": "Both ... and → Not only ... but also"}, {"id": 29, "question": "Where there is smoke, there is fire. (Negative)", "answer": "There is no smoke without fire.", "rule": "General truth to Negative"}, {"id": 30, "question": "Always speak the truth. (Negative)", "answer": "Never tell a lie.", "rule": "Opposite word + Negative"}, {"id": 31, "question": "Akbar was the greatest emperor of India. (Positive)", "answer": "No other emperor of India was as great as Akbar.", "rule": "Superlative to Positive"}, {"id": 32, "question": "Akbar was the greatest emperor of India. (Comparative)", "answer": "Akbar was greater than all other emperors of India.", "rule": "Superlative to Comparative"}, {"id": 33, "question": "Iron is the most useful metal. (Positive)", "answer": "No other metal is as useful as iron.", "rule": "Superlative to Positive"}, {"id": 34, "question": "He is as strong as a lion. (Comparative)", "answer": "A lion is not stronger than he.", "rule": "Positive to Comparative"}, {"id": 35, "question": "Dhaka is larger than all other cities in Bangladesh. (Superlative)", "answer": "Dhaka is the largest city in Bangladesh.", "rule": "Comparative to Superlative"}, {"id": 36, "question": "Gold is more precious than silver. (Positive)", "answer": "Silver is not so precious as gold.", "rule": "Comparative to Positive"}, {"id": 37, "question": "Cox's Bazar is the longest sea beach in the world. (Positive)", "answer": "No other sea beach in the world is as long as Cox's Bazar.", "rule": "Superlative to Positive"}, {"id": 38, "question": "Though he is poor, he is honest. (Simple)", "answer": "In spite of his poverty, he is honest.", "rule": "Complex to Simple (Though → In spite of)"}, {"id": 39, "question": "Though he is poor, he is honest. (Compound)", "answer": "He is poor, but he is honest.", "rule": "Complex to Compound (Though → but)"}, {"id": 40, "question": "Since the weather was foul, we stayed at home. (Simple)", "answer": "The weather being foul, we stayed at home.", "rule": "Complex to Simple (Absolute Nominative)"}, {"id": 41, "question": "Work hard and you will succeed. (Complex)", "answer": "If you work hard, you will succeed.", "rule": "Compound to Complex (and → If)"}, {"id": 42, "question": "Work hard or you will fail. (Complex)", "answer": "Unless you work hard, you will fail. / If you do not work hard, you will fail.", "rule": "Compound to Complex (or → Unless)"}, {"id": 43, "question": "Going to market, he bought a shirt. (Compound)", "answer": "He went to market and bought a shirt.", "rule": "Simple to Compound"}, {"id": 44, "question": "I saw a bird which was flying in the sky. (Simple)", "answer": "I saw a bird flying in the sky.", "rule": "Complex to Simple (Relative clause reduction)"}, {"id": 45, "question": "He confessed that he was guilty. (Simple)", "answer": "He confessed his guilt.", "rule": "Complex to Simple (Noun clause reduction)"}, {"id": 46, "question": "Honey tastes sweet. (Passive)", "answer": "Honey is sweet when it is tasted.", "rule": "Quasi-passive voice"}, {"id": 47, "question": "They elected him captain. (Passive)", "answer": "He was elected captain by them.", "rule": "Factitive object retained as complement"}, {"id": 48, "question": "I saw him play cricket. (Passive)", "answer": "He was seen to play cricket by me.", "rule": "Bare infinitive takes 'to' in passive"}, {"id": 49, "question": "He told me that he would come. (Passive)", "answer": "I was told by him that he would come.", "rule": "Complex sentence voice change"}, {"id": 50, "question": "We should not tease the poor. (Passive)", "answer": "The poor should not be teased by us.", "rule": "Modal auxiliary negative"}, {"id": 51, "question": "Post the letter. (Passive)", "answer": "Let the letter be posted.", "rule": "Imperative sentence"}, {"id": 52, "question": "Help the helpless. (Passive)", "answer": "Let the helpless be helped.", "rule": "Imperative sentence"}, {"id": 53, "question": "Do not make a noise. (Passive)", "answer": "Let not a noise be made.", "rule": "Negative imperative"}, {"id": 54, "question": "Who called you? (Passive)", "answer": "By whom were you called?", "rule": "Interrogative 'Who'"}, {"id": 55, "question": "What do you want? (Passive)", "answer": "What is wanted by you?", "rule": "Interrogative 'What'"}, {"id": 56, "question": "He made me drive the car. (Passive)", "answer": "I was made to drive the car by him.", "rule": "Causative passive takes 'to'"}, {"id": 57, "question": "He is known to all. (Active)", "answer": "All know him.", "rule": "Passive to Active"}, {"id": 58, "question": "The work will be finished by tomorrow. (Active)", "answer": "We / They will finish the work by tomorrow.", "rule": "Passive to Active (Assumed subject)"}, {"id": 59, "question": "He is too proud to learn. (Complex)", "answer": "He is so proud that he cannot learn.", "rule": "Too ... to → So ... that cannot"}, {"id": 60, "question": "Only graduation is required. (Negative)", "answer": "Nothing but graduation is required.", "rule": "Only (thing/qualification) → Nothing but"}, {"id": 61, "question": "As soon as we reached the station, the train left. (Negative)", "answer": "No sooner had we reached the station than the train left.", "rule": "As soon as → No sooner had"}, {"id": 62, "question": "Every cloud has a silver lining. (Negative)", "answer": "There is no cloud without a silver lining.", "rule": "Every → There is no ... without"}, {"id": 63, "question": "He is the wisest man in the village. (Comparative)", "answer": "He is wiser than any other man in the village.", "rule": "Superlative to Comparative"}, {"id": 64, "question": "He is the wisest man in the village. (Positive)", "answer": "No other man in the village is as wise as he.", "rule": "Superlative to Positive"}, {"id": 65, "question": "A plane flies faster than birds. (Positive)", "answer": "Birds do not fly as fast as a plane.", "rule": "Comparative to Positive"}, {"id": 66, "question": "Prevention is better than cure. (Positive)", "answer": "Cure is not so good as prevention.", "rule": "Proverbial comparative to positive"}, {"id": 67, "question": "In spite of being wealthy, he is unhappy. (Compound)", "answer": "He is wealthy, but he is unhappy.", "rule": "Simple to Compound"}, {"id": 68, "question": "Besides being intelligent, he is industrious. (Compound)", "answer": "He is not only intelligent but also industrious.", "rule": "Simple to Compound"}, {"id": 69, "question": "Taking his bag, he left the room. (Compound)", "answer": "He took his bag and left the room.", "rule": "Simple to Compound"}, {"id": 70, "question": "I know his birthplace. (Complex)", "answer": "I know where he was born.", "rule": "Simple to Complex (Noun clause)"}, {"id": 71, "question": "Tell me the truth. (Complex)", "answer": "Tell me what the truth is.", "rule": "Simple to Complex (Noun clause)"}, {"id": 72, "question": "He worked hard so that he could pass. (Simple)", "answer": "He worked hard to pass / in order to pass.", "rule": "Complex to Simple (Infinitive)"}, {"id": 73, "question": "If you do not hurry, you will miss the train. (Compound)", "answer": "Hurry up or you will miss the train.", "rule": "Complex to Compound"}, {"id": 74, "question": "Speak the truth or you will be punished. (Complex)", "answer": "Unless you speak the truth, you will be punished.", "rule": "Compound to Complex"}, {"id": 75, "question": "He bought a pen which was red. (Simple)", "answer": "He bought a red pen.", "rule": "Complex to Simple"}]}, "translation": {"subject": "English", "subject_code": "english", "topic": "Translation (৬০টি মাস্টার সেট)", "topic_code": "translation", "mark_distribution": "৫ নম্বর", "exam_tips": "লিখিত পরীক্ষায় সরাসরি বাংলা বাক্য দিয়ে ইংরেজি করতে বলা হয়। Tense, Voice, এবং Appropriate Preposition-এর সঠিক প্রয়োগ নিশ্চিত করুন।", "total_items": 75, "items": [{"id": 1, "bangla": "সে দিন এনে দিন খায়।", "english": "He lives from hand to mouth.", "grammar_note": "Idiomatic phrase 'live from hand to mouth'."}, {"id": 2, "bangla": "সকাল থেকে গুঁড়ি গুঁড়ি বৃষ্টি হচ্ছে।", "english": "It has been drizzling since morning.", "grammar_note": "Present Perfect Continuous with 'since'."}, {"id": 3, "bangla": "ডাক্তার আসার পূর্বে রোগী মারা গেল।", "english": "The patient had died before the doctor came.", "grammar_note": "Past Perfect before 'before'."}, {"id": 4, "bangla": "ডাক্তার আসার পর রোগী মারা গেল।", "english": "The patient died after the doctor had come.", "grammar_note": "Past Perfect after 'after'."}, {"id": 5, "bangla": "সে সাঁতার কাটতে জানে না।", "english": "He does not know how to swim.", "grammar_note": "Know + how to + V1 for skills."}, {"id": 6, "bangla": "চকচক করলেই সোনা হয় না।", "english": "All that glitters is not gold.", "grammar_note": "Proverb; takes singular verb 'is'."}, {"id": 7, "bangla": "চোরটিকে হাতেনাতে ধরা হলো।", "english": "The thief was caught red-handed.", "grammar_note": "Passive voice with idiom 'red-handed'."}, {"id": 8, "bangla": "তুমি কি কখনো সুন্দরবন গিয়েছো?", "english": "Have you ever been to the Sundarbans?", "grammar_note": "'Have been to' for visiting."}, {"id": 9, "bangla": "আমার একটি গান গাওয়ার ইচ্ছা আছে।", "english": "I feel like singing a song.", "grammar_note": "Feel like + V-ing."}, {"id": 10, "bangla": "গাছে কাঁঠাল গোঁফে তেল।", "english": "To count one's chickens before they are hatched.", "grammar_note": "Proverb."}, {"id": 11, "bangla": "সে হাসতে হাসতে ঘরে ঢুকল।", "english": "He entered the room laughing.", "grammar_note": "Participle 'laughing'. No preposition after 'enter' with place."}, {"id": 12, "bangla": "তার যা আছে তাই নিয়ে সে সন্তুষ্ট।", "english": "He is satisfied with what he has.", "grammar_note": "Satisfied with."}, {"id": 13, "bangla": "তিনি গতকাল এখানে এসেছিলেন।", "english": "He came here yesterday.", "grammar_note": "Past Indefinite Tense."}, {"id": 14, "bangla": "আমার ঘড়িতে এখন দশটা বাজে।", "english": "It is ten o'clock by my watch.", "grammar_note": "'By my watch' is appropriate."}, {"id": 15, "bangla": "একতাই বল।", "english": "Unity is strength.", "grammar_note": "Proverb."}, {"id": 16, "bangla": "পরিশ্রমই সৌভাগ্যের চাবিকাঠি।", "english": "Industry is the key to success.", "grammar_note": "Key to success."}, {"id": 17, "bangla": "সে আমাকে মিথ্যাবাদী বলল।", "english": "He called me a liar.", "grammar_note": "Factitive verb structure."}, {"id": 18, "bangla": "আমি তাকে দিয়ে চিঠিটি লিখিয়ে নিলাম।", "english": "I had the letter written by him. / I made him write the letter.", "grammar_note": "Causative verb (have/make)."}, {"id": 19, "bangla": "যত দ্রুত সম্ভব কাজটি সম্পন্ন করো।", "english": "Finish the work as soon as possible.", "grammar_note": "Imperative sentence."}, {"id": 20, "bangla": "বাংলাদেশ একটি নদীমাতৃক দেশ।", "english": "Bangladesh is a riverine country.", "grammar_note": "'Riverine' country."}, {"id": 21, "bangla": "মানুষ মরণশীল।", "english": "Man is mortal.", "grammar_note": "Universal truth; no article before 'man'."}, {"id": 22, "bangla": "আমি সেখানে না যেয়ে পারলাম না।", "english": "I could not but go there. / I could not help going there.", "grammar_note": "Could not but + V1 or could not help + V-ing."}, {"id": 23, "bangla": "বিপদ কখনো একা আসে না।", "english": "Misfortunes never come alone.", "grammar_note": "Proverb."}, {"id": 24, "bangla": "ধীরে এবং অবিচল ব্যক্তিই জয়লাভ করে।", "english": "Slow and steady wins the race.", "grammar_note": "Singular concept takes singular verb 'wins'."}, {"id": 25, "bangla": "তিনি কেবল একজন শিক্ষকই নন, একজন লেখকও।", "english": "He is not only a teacher but also a writer.", "grammar_note": "Not only ... but also."}, {"id": 26, "bangla": "যদি বৃষ্টি হয়, তবে আমি যাব না।", "english": "If it rains, I will not go.", "grammar_note": "First conditional."}, {"id": 27, "bangla": "গরিবদের অবহেলা করা উচিত নয়।", "english": "The poor should not be neglected.", "grammar_note": "'The poor' is plural class."}, {"id": 28, "bangla": "সমাজসেবা অধিদপ্তর অসহায় মানুষের পাশে দাঁড়ায়।", "english": "The Department of Social Services stands by the helpless people.", "grammar_note": "Stand by = support."}, {"id": 29, "bangla": "ধূমপান স্বাস্থ্যের জন্য ক্ষতিকর।", "english": "Smoking is injurious to health.", "grammar_note": "Injurious to."}, {"id": 30, "bangla": "আমার যদি পাখির মতো ডানা থাকত!", "english": "Had I the wings of a bird! / If I had the wings of a bird!", "grammar_note": "Subjunctive mood."}, {"id": 31, "bangla": "সময় ও স্রোত কারো জন্য অপেক্ষা করে না।", "english": "Time and tide wait for none.", "grammar_note": "Proverb."}, {"id": 32, "bangla": "তিনি কঠোর পরিশ্রমের মাধ্যমে উন্নতি করেছেন।", "english": "He prospered by dint of hard work.", "grammar_note": "Phrase: 'by dint of'."}, {"id": 33, "bangla": "তিনি সততার জন্য পরিচিত।", "english": "He is well known for his honesty.", "grammar_note": "Known for."}, {"id": 34, "bangla": "সততাই সর্বোৎকৃষ্ট পন্থা।", "english": "Honesty is the best policy.", "grammar_note": "Proverb."}, {"id": 35, "bangla": "বৃষ্টির কারণে খেলাটি স্থগিত করা হলো।", "english": "The match was called off on account of rain.", "grammar_note": "Call off = cancel/postpone."}, {"id": 36, "bangla": "যে রক্ষক সেই ভক্ষক।", "english": "The law-makers are the law-breakers.", "grammar_note": "Proverbial expression."}, {"id": 37, "bangla": "যত গর্জে তত বর্ষে না।", "english": "Barking dogs seldom bite.", "grammar_note": "Proverb."}, {"id": 38, "bangla": "দশ মিনিট ধরে বৃষ্টি হচ্ছে।", "english": "It has been raining for ten minutes.", "grammar_note": "'For' for period of time."}, {"id": 39, "bangla": "আমি তাকে তিন বছর ধরে চিনি।", "english": "I have known him for three years.", "grammar_note": "Stative verb 'know' takes Present Perfect, not Continuous."}, {"id": 40, "bangla": "তিনি একজন সৎ ও নিষ্ঠাবান কর্মকর্তা।", "english": "He is an honest and dedicated officer.", "grammar_note": "Article 'an' before silent 'h' sound."}, {"id": 41, "bangla": "লোভে পাপ, পাপে মৃত্যু।", "english": "Greed leads to sin and sin leads to death.", "grammar_note": "Proverb."}, {"id": 42, "bangla": "অহংকার পতনের মূল।", "english": "Pride goes before a fall.", "grammar_note": "Proverb."}, {"id": 43, "bangla": "তিনি আমাকে সাহায্য করতে অস্বীকার করলেন।", "english": "He refused to help me.", "grammar_note": "Refuse to + V1."}, {"id": 44, "bangla": "মেয়েটি দেখতে তার মায়ের মতো।", "english": "The girl takes after her mother.", "grammar_note": "Phrasal verb: 'take after' = resemble."}, {"id": 45, "bangla": "আমাদের উচিত প্রাকৃতিক দুর্যোগ মোকাবিলা করা।", "english": "We should cope with natural disasters.", "grammar_note": "Cope with (not cope up with)."}, {"id": 46, "bangla": "সে তার ভাইয়ের চেয়ে বুদ্ধিমান।", "english": "He is more intelligent than his brother.", "grammar_note": "Comparative degree."}, {"id": 47, "bangla": "সূর্য ওঠার পূর্বে আমরা রওনা হলাম।", "english": "We set out before the sun rose.", "grammar_note": "Phrasal verb: 'set out' = start journey."}, {"id": 48, "bangla": "যে যেমন কর্ম করে সে তেমন ফল পায়।", "english": "As you sow, so you reap.", "grammar_note": "Proverb."}, {"id": 49, "bangla": "তিনি একজন উচ্চপদস্থ কর্মকর্তা।", "english": "He is a high-ranking official.", "grammar_note": "Compound adjective."}, {"id": 50, "bangla": "তুমি কি কখনো তাজমহল দেখেছো?", "english": "Have you ever seen the Taj Mahal?", "grammar_note": "'The' before historical monuments."}, {"id": 51, "bangla": "ছেলেটি দিন দিন উন্নতি করছে।", "english": "The boy is improving day by day.", "grammar_note": "Present continuous for gradual change."}, {"id": 52, "bangla": "তিনি আমাকে একটি পরামর্শ দিলেন।", "english": "He gave me a piece of advice.", "grammar_note": "'Advice' is uncountable; use 'a piece of advice'."}, {"id": 53, "bangla": "তারা নদী পার হচ্ছিল।", "english": "They were crossing the river.", "grammar_note": "Past Continuous Tense."}, {"id": 54, "bangla": "আমরা দেশকে প্রাণ দিয়ে ভালোবাসি।", "english": "We love our country dearly.", "grammar_note": "Adverb 'dearly'."}, {"id": 55, "bangla": "কঠোর পরিশ্রম ছাড়া কেউ সফল হতে পারে না।", "english": "None can succeed without hard work.", "grammar_note": "Negative subject 'None'."}, {"id": 56, "bangla": "সে কাজটি করতে সমর্থ হয়েছিল।", "english": "He was able to do the work.", "grammar_note": "Be able to + V1."}, {"id": 57, "bangla": "তিনি নিয়মিত পত্রিকা পড়েন।", "english": "He reads newspapers regularly.", "grammar_note": "Habitual action in Present Indefinite."}, {"id": 58, "bangla": "দুষ্টু লোকটিকে পুলিশে সোপর্দ করা হলো।", "english": "The culprit was handed over to the police.", "grammar_note": "Hand over = surrender/transfer."}, {"id": 59, "bangla": "জ্ঞানই শক্তি।", "english": "Knowledge is power.", "grammar_note": "Proverb."}, {"id": 60, "bangla": "আমাদের সকলকে দেশের সেবায় এগিয়ে আসতে হবে।", "english": "We all have to come forward in the service of the nation.", "grammar_note": "Have to + V1 for obligation."}, {"id": 61, "bangla": "কর্তব্যে অবহেলা করো না।", "english": "Do not neglect your duty.", "grammar_note": "Imperative sentence."}, {"id": 62, "bangla": "তিনি আমার চেয়ে বয়সে বড়।", "english": "He is older than I. / He is senior to me.", "grammar_note": "Senior to / older than."}, {"id": 63, "bangla": "আজ খুব গরম পড়েছে।", "english": "It is very hot today.", "grammar_note": "Impersonal 'It'."}, {"id": 64, "bangla": "চোরটি পুলিশের ভয়ে পালিয়ে গেল।", "english": "The thief ran away for fear of police.", "grammar_note": "Phrase 'for fear of'."}, {"id": 65, "bangla": "সৎ লোক কখনো অসদুপায় অবলম্বন করে না।", "english": "An honest man never adopts unfair means.", "grammar_note": "Present Indefinite Tense."}, {"id": 66, "bangla": "আমরা নদী পার হওয়ার সময় ঝড় শুরু হলো।", "english": "A storm broke out while we were crossing the river.", "grammar_note": "While + Past Continuous."}, {"id": 67, "bangla": "তার কথা আমার বিশ্বাস হলো না।", "english": "I could not believe his words.", "grammar_note": "Modal 'could not'."}, {"id": 68, "bangla": "তিনি ইংরেজি বলতে অভ্যস্ত।", "english": "He is accustomed to speaking English.", "grammar_note": "Accustomed to + gerund."}, {"id": 69, "bangla": "বই পড়ার কোনো বিকল্প নেই।", "english": "There is no substitute for reading books.", "grammar_note": "Introductory 'There'."}, {"id": 70, "bangla": "আমরা বাংলাদেশকে একটি উন্নত দেশ হিসেবে দেখতে চাই।", "english": "We want to see Bangladesh as a developed nation.", "grammar_note": "Infinitive 'to see'."}, {"id": 71, "bangla": "তিনি বিপদে ধৈর্য ধারণ করেছিলেন।", "english": "He exercised patience in adversity.", "grammar_note": "Past Indefinite."}, {"id": 72, "bangla": "পরিশ্রম ছাড়া কোনো জাতি উন্নত হতে পারে না।", "english": "No nation can prosper without diligence.", "grammar_note": "Proverbial / General truth."}, {"id": 73, "bangla": "সততার পুরস্কার সবসময় ভালো হয়।", "english": "The reward of honesty is always sweet.", "grammar_note": "General truth."}, {"id": 74, "bangla": "তিনি আমাকে কথা দিয়েছিলেন।", "english": "He gave me his word.", "grammar_note": "Idiomatic expression 'give one's word'."}, {"id": 75, "bangla": "দেশ গঠনে যুবসমাজের ভূমিকা অপরিসীম।", "english": "The role of youth in nation-building is immense.", "grammar_note": "General statement."}]}}, "Math": {"bijgonit": {"subject": "গণিত", "subject_code": "math", "topic": "বীজগণিত (২০টি মাস্টার সেট - পূর্ণ লিখিত সমাধান)", "topic_code": "bijgonit", "mark_distribution": "৫ নম্বর", "exam_tips": "বীজগণিতে সূত্রে প্রয়োগ ও প্রতিস্থাপন সতর্কতার সাথে লিখবেন। প্রয়োজনীয় সূত্রটি খাতার ডান পাশে সেকেন্ড ব্র্যাকেটে লিখে দিলে পরীক্ষক পূর্ণ নম্বর দেন।", "total_items": 35, "items": [{"id": 1, "category": "মান নির্ণয়", "question": "যদি x - 1/x = 4 হয়, তবে x^2 + 1/x^2 এর মান কত?", "formula_used": "a^2 + b^2 = (a - b)^2 + 2ab", "solution_steps": ["দেওয়া আছে, x - 1/x = 4", "প্রদত্ত রাশি = x^2 + 1/x^2", "= (x - 1/x)^2 + 2 · x · (1/x)", "= (4)^2 + 2", "= 16 + 2 = 18"], "answer": "18"}, {"id": 2, "category": "মান নির্ণয়", "question": "যদি x + 1/x = 3 হয়, তবে x^3 + 1/x^3 এর মান কত?", "formula_used": "a^3 + b^3 = (a + b)^3 - 3ab(a + b)", "solution_steps": ["দেওয়া আছে, x + 1/x = 3", "প্রদত্ত রাশি = x^3 + 1/x^3", "= (x + 1/x)^3 - 3 · x · (1/x) · (x + 1/x)", "= (3)^3 - 3(3)", "= 27 - 9 = 18"], "answer": "18"}, {"id": 3, "category": "মান নির্ণয়", "question": "যদি a + b = 7 এবং ab = 12 হয়, তবে a^2 + b^2 এবং (a - b)^2 এর মান নির্ণয় করুন।", "formula_used": "a^2 + b^2 = (a + b)^2 - 2ab এবং (a - b)^2 = (a + b)^2 - 4ab", "solution_steps": ["দেওয়া আছে, a + b = 7 এবং ab = 12", "১ম রাশি: a^2 + b^2 = (a + b)^2 - 2ab", "= (7)^2 - 2(12) = 49 - 24 = 25", "২য় রাশি: (a - b)^2 = (a + b)^2 - 4ab", "= (7)^2 - 4(12) = 49 - 48 = 1"], "answer": "a^2 + b^2 = 25 এবং (a - b)^2 = 1"}, {"id": 4, "category": "মান নির্ণয়", "question": "যদি x^2 - 3x + 1 = 0 হয়, তবে প্রমাণ করুন যে x^2 + 1/x^2 = 7।", "formula_used": "উভয়পক্ষকে x দ্বারা ভাগ", "solution_steps": ["দেওয়া আছে, x^2 - 3x + 1 = 0", "বা, x^2 + 1 = 3x", "উভয়পক্ষকে x দ্বারা ভাগ করে পাই,", "(x^2 + 1) / x = 3x / x", "বা, x + 1/x = 3", "বামপক্ষ = x^2 + 1/x^2", "= (x + 1/x)^2 - 2 · x · (1/x)", "= (3)^2 - 2 = 9 - 2 = 7 = ডানপক্ষ (প্রমাণিত)"], "answer": "প্রমাণিত (মান ৭)"}, {"id": 5, "category": "মান নির্ণয়", "question": "যদি a - 1/a = 3 হয়, তবে a^4 + 1/a^4 এর মান নির্ণয় করুন।", "formula_used": "বর্গের সূত্র দুবার প্রয়োগ", "solution_steps": ["দেওয়া আছে, a - 1/a = 3", "উভয়পক্ষকে বর্গ করে পাই,", "(a - 1/a)^2 = (3)^2", "বা, a^2 - 2 + 1/a^2 = 9", "বা, a^2 + 1/a^2 = 9 + 2 = 11", "আবার উভয়পক্ষকে বর্গ করে পাই,", "(a^2 + 1/a^2)^2 = (11)^2", "বা, a^4 + 2 + 1/a^4 = 121", "বা, a^4 + 1/a^4 = 121 - 2 = 119"], "answer": "119"}, {"id": 6, "category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: x^2 + 7x + 12", "formula_used": "মধ্যপদ বিভাজন (Middle term factor)", "solution_steps": ["প্রদত্ত রাশি = x^2 + 7x + 12", "এখানে, 12 = 4 × 3 এবং 4 + 3 = 7", "= x^2 + 4x + 3x + 12", "= x(x + 4) + 3(x + 4)", "= (x + 4)(x + 3)"], "answer": "(x + 4)(x + 3)"}, {"id": 7, "category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: x^2 - 5x - 6", "formula_used": "মধ্যপদ বিভাজন", "solution_steps": ["প্রদত্ত রাশি = x^2 - 5x - 6", "এখানে, -6 = (-6) × 1 এবং -6 + 1 = -5", "= x^2 - 6x + x - 6", "= x(x - 6) + 1(x - 6)", "= (x - 6)(x + 1)"], "answer": "(x - 6)(x + 1)"}, {"id": 8, "category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: 2x^2 + 9x + 10", "formula_used": "মধ্যপদ বিভাজন", "solution_steps": ["প্রদত্ত রাশি = 2x^2 + 9x + 10", "এখানে, 2 × 10 = 20 এবং 20 = 5 × 4, যেখানে 5 + 4 = 9", "= 2x^2 + 4x + 5x + 10", "= 2x(x + 2) + 5(x + 2)", "= (x + 2)(2x + 5)"], "answer": "(x + 2)(2x + 5)"}, {"id": 9, "category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: a^3 - 8", "formula_used": "a^3 - b^3 = (a - b)(a^2 + ab + b^2)", "solution_steps": ["প্রদত্ত রাশি = a^3 - 8 = a^3 - (2)^3", "আমরা জানি, a^3 - b^3 = (a - b)(a^2 + ab + b^2)", "= (a - 2)(a^2 + a·2 + 2^2)", "= (a - 2)(a^2 + 2a + 4)"], "answer": "(a - 2)(a^2 + 2a + 4)"}, {"id": 10, "category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: x^4 + x^2 + 1", "formula_used": "বর্গের সূত্রে এনে a^2 - b^2 প্রয়োগ", "solution_steps": ["প্রদত্ত রাশি = x^4 + x^2 + 1", "= (x^2)^2 + 2·x^2·1 + (1)^2 - x^2", "= (x^2 + 1)^2 - (x)^2", "= (x^2 + 1 + x)(x^2 + 1 - x)", "= (x^2 + x + 1)(x^2 - x + 1)"], "answer": "(x^2 + x + 1)(x^2 - x + 1)"}, {"id": 11, "category": "মান নির্ণয়", "question": "যদি 2x + 2/x = 3 হয়, তবে x^3 + 1/x^3 + 2 এর মান নির্ণয় করুন।", "formula_used": "ঘন নির্ণয়ের অনুসিদ্ধান্ত", "solution_steps": ["দেওয়া আছে, 2x + 2/x = 3", "বা, 2(x + 1/x) = 3", "বা, x + 1/x = 3/2", "আমরা জানি, x^3 + 1/x^3 = (x + 1/x)^3 - 3(x + 1/x)", "= (3/2)^3 - 3(3/2) = 27/8 - 9/2 = (27 - 36) / 8 = -9/8", "প্রদত্ত রাশি = x^3 + 1/x^3 + 2", "= -9/8 + 2 = (-9 + 16) / 8 = 7/8"], "answer": "7/8"}, {"id": 12, "category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: a^3 + 64b^3", "formula_used": "a^3 + b^3 = (a + b)(a^2 - ab + b^2)", "solution_steps": ["প্রদত্ত রাশি = a^3 + (4b)^3", "= (a + 4b){a^2 - a(4b) + (4b)^2}", "= (a + 4b)(a^2 - 4ab + 16b^2)"], "answer": "(a + 4b)(a^2 - 4ab + 16b^2)"}, {"id": 13, "category": "মান নির্ণয়", "question": "যদি a + b + c = 9 এবং ab + bc + ca = 31 হয়, তবে a^2 + b^2 + c^2 এর মান কত?", "formula_used": "a^2 + b^2 + c^2 = (a + b + c)^2 - 2(ab + bc + ca)", "solution_steps": ["আমরা জানি, a^2 + b^2 + c^2 = (a + b + c)^2 - 2(ab + bc + ca)", "= (9)^2 - 2(31)", "= 81 - 62 = 19"], "answer": "19"}, {"id": 14, "category": "মান নির্ণয়", "question": "যদি p - q = 5 এবং pq = 3 হয়, তবে p^3 - q^3 এর মান নির্ণয় করুন।", "formula_used": "p^3 - q^3 = (p - q)^3 + 3pq(p - q)", "solution_steps": ["আমরা জানি, p^3 - q^3 = (p - q)^3 + 3pq(p - q)", "= (5)^3 + 3(3)(5)", "= 125 + 45 = 170"], "answer": "170"}, {"id": 15, "category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: x^2 - 2xy + y^2 - 16", "formula_used": "a^2 - b^2 সূত্র", "solution_steps": ["প্রদত্ত রাশি = (x - y)^2 - (4)^2", "= (x - y + 4)(x - y - 4)"], "answer": "(x - y + 4)(x - y - 4)"}, {"id": 16, "category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: 4a^4 + 1", "formula_used": "a^2 - b^2 রূপান্তর", "solution_steps": ["প্রদত্ত রাশি = (2a^2)^2 + (1)^2 + 2·(2a^2)·1 - 4a^2", "= (2a^2 + 1)^2 - (2a)^2", "= (2a^2 + 1 + 2a)(2a^2 + 1 - 2a)", "= (2a^2 + 2a + 1)(2a^2 - 2a + 1)"], "answer": "(2a^2 + 2a + 1)(2a^2 - 2a + 1)"}, {"id": 17, "category": "মান নির্ণয়", "question": "যদি x = √3 + √2 হয়, তবে x + 1/x এবং x^2 - 1/x^2 এর মান কত?", "formula_used": "অনুবন্ধী গুণ ও বীজগণিতীয় সূত্র", "solution_steps": ["1/x = 1 / (√3 + √2) = (√3 - √2) / {(√3 + √2)(√3 - √2)} = √3 - √2", "x + 1/x = (√3 + √2) + (√3 - √2) = 2√3", "x - 1/x = (√3 + √2) - (√3 - √2) = 2√2", "x^2 - 1/x^2 = (x + 1/x)(x - 1/x) = 2√3 × 2√2 = 4√6"], "answer": "x + 1/x = 2√3 এবং x^2 - 1/x^2 = 4√6"}, {"id": 18, "category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: x^3 - 7x - 6", "formula_used": "ভাগশেষ উপপাদ্য (Vanishing method)", "solution_steps": ["ধরি, f(x) = x^3 - 7x - 6", "x = -1 বসালে, f(-1) = (-1)^3 - 7(-1) - 6 = -1 + 7 - 6 = 0", "সুতরাং (x + 1) রাশিটির একটি সাধারণ উৎপাদক।", "x^3 - 7x - 6 = x^3 + x^2 - x^2 - x - 6x - 6", "= x^2(x + 1) - x(x + 1) - 6(x + 1)", "= (x + 1)(x^2 - x - 6)", "= (x + 1)(x - 3)(x + 2)"], "answer": "(x + 1)(x - 3)(x + 2)"}, {"id": 19, "category": "মান নির্ণয়", "question": "যদি a/b + b/a = 2 হয়, তবে a ও b এর মধ্যে সম্পর্ক নির্ণয় করুন।", "formula_used": "ভগ্নাংশের যোগ ও পূর্ণবর্গ গঠন", "solution_steps": ["a/b + b/a = 2", "বা, (a^2 + b^2) / ab = 2", "বা, a^2 + b^2 = 2ab", "বা, a^2 - 2ab + b^2 = 0", "বা, (a - b)^2 = 0", "বা, a - b = 0", "অতএব, a = b"], "answer": "a = b"}, {"id": 20, "category": "মান নির্ণয়", "question": "যদি x + y = 12 এবং xy = 27 হয়, তবে (x - y)^2 এর মান কত?", "formula_used": "(x - y)^2 = (x + y)^2 - 4xy", "solution_steps": ["(x - y)^2 = (x + y)^2 - 4xy", "= (12)^2 - 4(27)", "= 144 - 108 = 36"], "answer": "36"}, {"category": "মান নির্ণয়", "question": "যদি x + y = 5 এবং x - y = 3 হয়, তবে 2(x^2 + y^2) এবং 4xy এর মান নির্ণয় করুন।", "formula_used": "2(a^2 + b^2) = (a + b)^2 + (a - b)^2 এবং 4ab = (a + b)^2 - (a - b)^2", "solution_steps": ["১ম রাশি: 2(x^2 + y^2) = (x + y)^2 + (x - y)^2", "= (5)^2 + (3)^2 = 25 + 9 = 34", "২য় রাশি: 4xy = (x + y)^2 - (x - y)^2", "= (5)^2 - (3)^2 = 25 - 9 = 16"], "answer": "2(x^2 + y^2) = 34 এবং 4xy = 16", "id": 21}, {"category": "মান নির্ণয়", "question": "যদি a + b = √7 এবং a - b = √3 হয়, তবে প্রমাণ করুন যে 8ab(a^2 + b^2) = 40।", "formula_used": "8ab(a^2 + b^2) = 4ab · 2(a^2 + b^2)", "solution_steps": ["বামপক্ষ = 8ab(a^2 + b^2)", "= 4ab · 2(a^2 + b^2)", "= {(a + b)^2 - (a - b)^2} · {(a + b)^2 + (a - b)^2}", "= {(√7)^2 - (√3)^2} · {(√7)^2 + (√3)^2}", "= (7 - 3) · (7 + 3)", "= 4 · 10 = 40 = ডানপক্ষ (প্রমাণিত)"], "answer": "প্রমাণিত (মান ৪০)", "id": 22}, {"category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: x^3 - 3x^2 + 4", "formula_used": "ভাগশেষ উপপাদ্য (Vanishing method)", "solution_steps": ["ধরি, f(x) = x^3 - 3x^2 + 4", "x = -1 বসালে, f(-1) = (-1)^3 - 3(-1)^2 + 4 = -1 - 3 + 4 = 0", "সুতরাং (x + 1) প্রদত্ত রাশির একটি উৎপাদক।", "x^3 - 3x^2 + 4 = x^3 + x^2 - 4x^2 - 4x + 4x + 4", "= x^2(x + 1) - 4x(x + 1) + 4(x + 1)", "= (x + 1)(x^2 - 4x + 4)", "= (x + 1)(x - 2)^2"], "answer": "(x + 1)(x - 2)^2", "id": 23}, {"category": "মান নির্ণয়", "question": "যদি x = 3 + 2√2 হয়, তবে √x - 1/√x এর মান কত?", "formula_used": "বর্গের সূত্রে রূপান্তর", "solution_steps": ["x = 3 + 2√2 = 2 + 2√2 + 1 = (√2)^2 + 2·√2·1 + (1)^2 = (√2 + 1)^2", "অতএব, √x = √(√2 + 1)^2 = √2 + 1", "1/√x = 1 / (√2 + 1) = (√2 - 1) / {(√2 + 1)(√2 - 1)} = √2 - 1", "অতএব, √x - 1/√x = (√2 + 1) - (√2 - 1) = √2 + 1 - √2 + 1 = 2"], "answer": "2", "id": 24}, {"category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: a^3 - 9b^3 + (a + b)^3", "formula_used": "ঘনের সূত্রে রূপান্তর", "solution_steps": ["প্রদত্ত রাশি = a^3 - b^3 + (a + b)^3 - 8b^3", "= (a - b)(a^2 + ab + b^2) + {(a + b)^3 - (2b)^3}", "= (a - b)(a^2 + ab + b^2) + (a + b - 2b){(a + b)^2 + (a + b)(2b) + (2b)^2}", "= (a - b)(a^2 + ab + b^2) + (a - b){a^2 + 2ab + b^2 + 2ab + 2b^2 + 4b^2}", "= (a - b)(a^2 + ab + b^2) + (a - b)(a^2 + 4ab + 7b^2)", "= (a - b){(a^2 + ab + b^2) + (a^2 + 4ab + 7b^2)}", "= (a - b)(2a^2 + 5ab + 8b^2)"], "answer": "(a - b)(2a^2 + 5ab + 8b^2)", "id": 25}, {"category": "মান নির্ণয়", "question": "যদি a^4 + a^2 b^2 + b^4 = 8 এবং a^2 + ab + b^2 = 4 হয়, তবে a^2 + b^2 এবং ab এর মান নির্ণয় করুন।", "formula_used": "a^4 + a^2b^2 + b^4 = (a^2 + ab + b^2)(a^2 - ab + b^2)", "solution_steps": ["আমরা জানি, a^4 + a^2b^2 + b^4 = (a^2 + ab + b^2)(a^2 - ab + b^2)", "বা, 8 = 4(a^2 - ab + b^2)", "বা, a^2 - ab + b^2 = 8/4 = 2", "এখন, (a^2 + ab + b^2) + (a^2 - ab + b^2) = 4 + 2", "বা, 2(a^2 + b^2) = 6, অতএব a^2 + b^2 = 3", "এবং বিয়োগ করে পাই: 2ab = 4 - 2 = 2, অতএব ab = 1"], "answer": "a^2 + b^2 = 3 এবং ab = 1", "id": 26}, {"category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: x^2 + (p + q)x + pq", "formula_used": "সাধারণ মধ্যপদ সূত্র", "solution_steps": ["প্রদত্ত রাশি = x^2 + px + qx + pq", "= x(x + p) + q(x + p)", "= (x + p)(x + q)"], "answer": "(x + p)(x + q)", "id": 27}, {"category": "মান নির্ণয়", "question": "যদি x + 1/x = √3 হয়, তবে প্রমাণ করুন যে x^6 + 1 = 0।", "formula_used": "ঘন নির্ণয় সূত্র", "solution_steps": ["দেওয়া আছে, x + 1/x = √3", "উভয়পক্ষকে ঘন করে পাই,", "(x + 1/x)^3 = (√3)^3", "বা, x^3 + 1/x^3 + 3·x·(1/x)(x + 1/x) = 3√3", "বা, x^3 + 1/x^3 + 3(√3) = 3√3", "বা, x^3 + 1/x^3 = 0", "বা, (x^6 + 1) / x^3 = 0", "অতএব, x^6 + 1 = 0 (প্রমাণিত)"], "answer": "প্রমাণিত", "id": 28}, {"category": "মান নির্ণয়", "question": "যদি x + 1/x = 4 হয়, তবে x^4 + 1/x^4 এর মান নির্ণয় করুন।", "formula_used": "বর্গের সূত্র পরপর দুবার", "solution_steps": ["দেওয়া আছে, x + 1/x = 4", "বর্গ করে পাই: (x + 1/x)^2 = (4)^2", "বা, x^2 + 2 + 1/x^2 = 16", "বা, x^2 + 1/x^2 = 16 - 2 = 14", "আবার বর্গ করে পাই: (x^2 + 1/x^2)^2 = (14)^2", "বা, x^4 + 2 + 1/x^4 = 196", "অতএব, x^4 + 1/x^4 = 196 - 2 = 194"], "answer": "194", "id": 29}, {"category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: x^2 - y^2 + 2yz - z^2", "formula_used": "পূর্ণবর্গ ও a^2 - b^2 সূত্র", "solution_steps": ["প্রদত্ত রাশি = x^2 - (y^2 - 2yz + z^2)", "= (x)^2 - (y - z)^2", "= {x + (y - z)}{x - (y - z)}", "= (x + y - z)(x - y + z)"], "answer": "(x + y - z)(x - y + z)", "id": 30}, {"category": "মান নির্ণয় (ঘন)", "question": "x - 1/x = 4 হলে, x^3 - 1/x^3 এর মান কত?", "solution_steps": ["দেওয়া আছে, x - 1/x = 4", "আমরা জানি, a^3 - b^3 = (a - b)^3 + 3ab(a - b)", "অতএব, x^3 - 1/x^3 = (x - 1/x)^3 + 3 · x · (1/x) · (x - 1/x)", "= (4)^3 + 3(1)(4)", "= 64 + 12 = 76।"], "answer": "76", "formula_used": "a^3 - b^3 = (a - b)^3 + 3ab(a - b)", "id": 31}, {"category": "মান নির্ণয় (চতুর্থ ঘাত)", "question": "a + 1/a = 3 হলে, a^4 + 1/a^4 এর মান কত?", "solution_steps": ["দেওয়া আছে, a + 1/a = 3", "উভয় পক্ষকে বর্গ করে পাই: (a + 1/a)^2 = 3^2", "বা, a^2 + 2 · a · (1/a) + 1/a^2 = 9", "বা, a^2 + 1/a^2 = 9 - 2 = 7", "পুনরায় উভয় পক্ষকে বর্গ করে পাই: (a^2 + 1/a^2)^2 = 7^2", "বা, a^4 + 2 · a^2 · (1/a^2) + 1/a^4 = 49", "বা, a^4 + 1/a^4 = 49 - 2 = 47।"], "answer": "47", "formula_used": "(a + b)^2 = a^2 + 2ab + b^2", "id": 32}, {"category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: x^2 - 5x + 6", "solution_steps": ["প্রদত্ত রাশি = x^2 - 5x + 6", "মধ্যপদ ভেঙে পাই (Middle-term break): -5x = -2x - 3x এবং (-2) × (-3) = 6", "= x^2 - 2x - 3x + 6", "= x(x - 2) - 3(x - 2)", "= (x - 2)(x - 3)।"], "answer": "(x - 2)(x - 3)", "formula_used": "মধ্যপদ বিভাজন পদ্ধতি।", "id": 33}, {"category": "উৎপাদকে বিশ্লেষণ", "question": "উৎপাদকে বিশ্লেষণ করুন: 4x^2 - 25y^2", "solution_steps": ["প্রদত্ত রাশি = 4x^2 - 25y^2", "= (2x)^2 - (5y)^2", "a^2 - b^2 = (a + b)(a - b) সূত্র প্রয়োগ করে পাই:", "= (2x + 5y)(2x - 5y)।"], "answer": "(2x + 5y)(2x - 5y)", "formula_used": "a^2 - b^2 = (a + b)(a - b)", "id": 34}, {"category": "সরল সমীকরণ", "question": "সমাধান করুন: 2x + 3y = 7 এবং 3x - 2y = 4", "solution_steps": ["2x + 3y = 7 ... (১)", "3x - 2y = 4 ... (২)", "(১) নং সমীকরণকে ২ দ্বারা এবং (২) নং সমীকরণকে ৩ দ্বারা গুণ করে পাই:", "4x + 6y = 14", "9x - 6y = 12", "সমীকরণ দুটি যোগ করে পাই: 13x = 26 বা, x = 2।", "x এর মান (১) নং সমীকরণে বসিয়ে পাই:", "2(2) + 3y = 7 বা, 4 + 3y = 7 বা, 3y = 3 বা, y = 1।", "অতএব, নির্ণেয় সমাধান (x, y) = (2, 1)।"], "answer": "x = 2, y = 1", "formula_used": "অপনয়ন পদ্ধতি (Method of Elimination)।", "id": 35}]}, "jyamiti": {"subject": "গণিত", "subject_code": "MATH-03", "topic": "জ্যামিতি (সংজ্ঞা, বৈশিষ্ট্য ও সমাধান)", "topic_en": "Geometry Basics, Definitions & Problems", "total_items": 23, "description": "লিখিত পরীক্ষায় জ্যামিতির ৫ নম্বরের জন্য সংজ্ঞা, উপপাদ্য এবং পরিমিতি সংক্রান্ত সমাধানমালা।", "exam_tip": "সংজ্ঞার সাথে আবশ্যকীয় বৈশিষ্ট্য ও সূত্রের উল্লেখ থাকলে পূর্ণ ৫-এ ৫ নম্বর পাওয়া যায়।", "items": [{"id": 1, "title": "পূরক কোণ (Complementary Angle)", "question": "পূরক কোণ কাকে বলে? উদাহরণ দিন।", "definition": "দুটি কোণের পরিমাপের সমষ্টি ৯০ ডিগ্রি (বা এক সমকোণ) হলে, তাদের একটিকে অপরটির পূরক কোণ বলে।", "formula": "কোণ A + কোণ B = ৯০°", "example": "যেমন: ৩০° কোণের পূরক কোণ হলো (৯০° - ৩০°) = ৬০°।"}, {"id": 2, "title": "সম্পূরক কোণ (Supplementary Angle)", "question": "সম্পূরক কোণ কাকে বলে? উদাহরণ দিন।", "definition": "দুটি কোণের পরিমাপের সমষ্টি ১৮০ ডিগ্রি (বা দুই সমকোণ / এক সরলকোণ) হলে, তাদের একটিকে অপরটির সম্পূরক কোণ বলে।", "formula": "কোণ A + কোণ B = ১৮০°", "example": "যেমন: ৭০° কোণের সম্পূরক কোণ হলো (১৮০° - ৭০°) = ১১০°।"}, {"id": 3, "title": "বিপ্রতীপ কোণ (Vertically Opposite Angle)", "question": "বিপ্রতীপ কোণ কাকে বলে? এর প্রধান বৈশিষ্ট্য কী?", "definition": "দুটি সরলরেখা পরস্পর ছেদ করলে ছেদবিন্দুতে যে চারটি কোণ উৎপন্ন হয়, তাদের যেকোনো একটি কোণের বিপরীত কোণকে তার বিপ্রতীপ কোণ বলে।", "formula": "বিপ্রতীপ কোণদ্বয় সর্বদা পরস্পর সমান হয়।", "example": "যেমন: দুটি রেখা ছেদ করলে উৎপন্ন একটি কোণ ৫০° হলে এর বিপরীত পাশের কোণটিও ৫০° হবে।"}, {"id": 4, "title": "সমকোণী ত্রিভুজ ও পিথাগোরাসের উপপাদ্য", "question": "সমকোণী ত্রিভুজ কাকে বলে? পিথাগোরাসের উপপাদ্যটি বিবৃত করুন।", "definition": "যে ত্রিভুজের একটি কোণ সমকোণ (৯০°), তাকে সমকোণী ত্রিভুজ বলে। সমকোণের বিপরীত বাহুকে অতিভুজ বলে।", "formula": "(অতিভুজ)^২ = (ভূমি)^২ + (লম্ব)^২", "example": "একটি সমকোণী ত্রিভুজের ভূমি ৪ সেমি এবং লম্ব ৩ সেমি হলে, অতিভুজ = √(৪^২ + ৩^২) = √(১৬ + ৯) = √২৫ = ৫ সেমি।"}, {"id": 5, "title": "সমদ্বিবাহু ত্রিভুজ", "question": "সমদ্বিবাহু ত্রিভুজ কাকে বলে? এর ক্ষেত্রফলের সূত্রটি কী?", "definition": "যে ত্রিভুজের দুটি বাহুর দৈর্ঘ্য পরস্পর সমান, তাকে সমদ্বিবাহু ত্রিভুজ বলে। সমান সমান বাহুদ্বয়ের বিপরীত কোণ দুটিও পরস্পর সমান হয়।", "formula": "ক্ষেত্রফল = (b / 4) × √(4a^2 - b^2) [যেখানে a = সমান সমান বাহুর দৈর্ঘ্য, b = ভূমির দৈর্ঘ্য]", "example": "সমান বাহু ৫ মিটার ও ভূমি ৬ মিটার হলে ক্ষেত্রফল = (৬/৪) × √(৪×২৫ - ৩৬) = ১.৫ × √৬৪ = ১.৫ × ৮ = ১২ বর্গমিটার।"}, {"id": 6, "title": "সমবাহু ত্রিভুজ", "question": "সমবাহু ত্রিভুজ কাকে বলে? এর ক্ষেত্রফল ও উচ্চতার সূত্র লিখুন।", "definition": "যে ত্রিভুজের তিনটি বাহুর দৈর্ঘ্যই সমান, তাকে সমবাহু ত্রিভুজ বলে। এর প্রতিটি কোণের মান ৬০ ডিগ্রি।", "formula": "ক্ষেত্রফল = (√3 / 4) × a^2 [যেখানে a = প্রতিটি বাহুর দৈর্ঘ্য]; উচ্চতা = (√3 / 2) × a", "example": "বাহুর দৈর্ঘ্য ৪ মিটার হলে ক্ষেত্রফল = (√3 / 4) × 16 = 4√3 বর্গমিটার।"}, {"id": 7, "title": "সামান্তরিক (Parallelogram)", "question": "সামান্তরিক কাকে বলে? এর বৈশিষ্ট্য ও ক্ষেত্রফলের সূত্র লিখুন।", "definition": "যে চতুর্ভুজের বিপরীত বাহুগুলো পরস্পর সমান্তরাল ও সমান, কিন্তু কোনো কোণই সমকোণ নয়, তাকে সামান্তরিক বলে।", "formula": "ক্ষেত্রফল = ভূমি × উচ্চতা", "example": "বৈশিষ্ট্য: বিপরীত কোণদ্বয় সমান, কর্ণদ্বয় পরস্পরকে সমদ্বিখণ্ডিত করে।"}, {"id": 8, "title": "রম্বস (Rhombus)", "question": "রম্বস কাকে বলে? এর ক্ষেত্রফলের সূত্র লিখুন।", "definition": "যে চতুর্ভুজের চারটি বাহুই পরস্পর সমান কিন্তু কোনো কোণই সমকোণ নয়, তাকে রম্বস বলে।", "formula": "ক্ষেত্রফল = ১/২ × (কর্ণ ১ × কর্ণ ২)", "example": "যদি কোনো রম্বসের কর্ণদ্বয় যথাক্রমে ৮ সেমি ও ৬ সেমি হয়, তবে ক্ষেত্রফল = ১/২ × ৮ × ৬ = ২৪ বর্গ সেমি।"}, {"id": 9, "title": "ট্রাপিজিয়াম (Trapezium)", "question": "ট্রাপিজিয়াম কাকে বলে? এর ক্ষেত্রফলের সূত্র লিখুন।", "definition": "যে চতুর্ভুজের একজোড়া বিপরীত বাহু সমান্তরাল কিন্তু অপর বাহুদ্বয় অসমান্তরাল, তাকে ট্রাপিজিয়াম বলে।", "formula": "ক্ষেত্রফল = ১/২ × (সমান্তরাল বাহুদ্বয়ের যোগফল) × সমান্তরাল বাহুদ্বয়ের মধ্যবর্তী দূরত্ব", "example": "সমান্তরাল বাহু দুটি যথাক্রমে ৯ সেমি ও ৭ সেমি এবং উচ্চতা ৫ সেমি হলে, ক্ষেত্রফল = ১/২ × (৯ + ৭) × ৫ = ৪০ বর্গ সেমি।"}, {"id": 10, "title": "বৃত্ত, ব্যাস ও পরিধি", "question": "বৃত্তের পরিধি ও ক্ষেত্রফলের সূত্র লিখুন। ব্যাস ও ব্যাসার্ধের সম্পর্ক কী?", "definition": "একটি নির্দিষ্ট বিন্দু থেকে সর্বদা সমান দূরত্ব বজায় রেখে কোনো চলমান বিন্দুর তৈরি আবদ্ধ বক্ররেখাকে বৃত্ত বলে।", "formula": "পরিধি = 2πr; ক্ষেত্রফল = πr^2; ব্যাস (d) = 2r [যেখানে r = ব্যাসার্ধ, π ≈ ৩.১৪১৬]", "example": "একটি বৃত্তের ব্যাসার্ধ ৭ সেমি হলে এর ক্ষেত্রফল = (২২/৭) × ৭^২ = ১৫৪ বর্গ সেমি।"}, {"id": 11, "title": "আয়তক্ষেত্রের ক্ষেত্রফল ও পরিসীমা", "question": "আয়তক্ষেত্রের ক্ষেত্রফল, পরিসীমা ও কর্ণের দৈর্ঘ্যের সূত্র লিখুন।", "definition": "যে চতুর্ভুজের বিপরীত বাহুগুলো সমান ও সমান্তরাল এবং প্রতিটি কোণ সমকোণ (৯০°), tegory": "ইতিহাস"}, {"id": 2, "question": "মুজিবনগর সরকার কবে গঠিত হয় এবং কবে শপথ গ্রহণ করে?", "answer": "মুজিবনগর সরকার ১৯৭১ সালের ১০ এপ্রিল গঠিত হয় এবং ১৯৭১ সালের ১৭ এপ্রিল মেহেরপুরের বৈদ্যনাথতলার (বর্তমান মুজিবনগর) ভবেরপাড়া গ্রামের আম্রকাননে শপথ গ্রহণ করে।", "category": "মুক্তিযুদ্ধ"}, {"id": 3, "question": "মুজিবনগর সরকারের প্রধানমন্ত্রী এবং অস্থায়ী রাষ্ট্রপতি কে ছিলেন?", "answer": "প্রধানমন্ত্রী ছিলেন তাজউদ্দীন আহমদ এবং অস্থায়ী রাষ্ট্রপতি ছিলেন সৈয়দ নজরুল ইসলাম। (রাষ্ট্রপতি ছিলেন বঙ্গবন্ধু শেখ মুজিবুর রহমান)।", "category": "মুক্তিযুদ্ধ"}, {"id": 4, "question": "মুক্তিযুদ্ধে বাংলাদেশকে কয়টি সেক্টরে বিভক্ত করা হয়েছিল এবং নিয়মিত ব্রিগেড কয়টি ছিল?", "answer": "মুক্তিযুদ্ধে বাংলাদেশকে মোট ১১টি প্রশাসনিক সেক্টরে এবং ৬৪টি সাব-সেক্টরে বিভক্ত করা হয়। এছাড়া ৩টি নিয়মিত ব্রিগেড ফোর্স (জেড ফোর্স, কে ফোর্স, এস ফোর্স) ছিল।", "category": "মুক্তিযুদ্ধ"}, {"id": 5, "question": "মুক্তিযুদ্ধে একমাত্র নৌ-সেক্টরের নাম ও কমান্ডার কে ছিলেন?", "answer": "নৌ-সেক্টর ছিল ১০ নম্বর সেক্টর। এই সেক্টরে কোনো নিয়মিত কমান্ডার ছিল না; নৌ-কমান্ডোরা যখন যে এলাকায় অপারেশন চালাতেন, তখন সে এলাকার সেক্টর কমান্ডারের অধীনে কাজ করতেন।", "category": "মুক্তিযুদ্ধ"}, {"id": 6, "question": "বীরশ্রেষ্ঠ খেতাবপ্রাপ্তদের সংখ্যা কত এবং প্রথম ও সর্বকনিষ্ঠ বীরশ্রেষ্ঠ কে?", "answer": "বীরশ্রেষ্ঠ খেতাবপ্রাপ্ত সর্বমোট ৭ জন। প্রথম শহীদ বীরশ্রেষ্ঠ ল্যান্স নায়েক মুন্সী আব্দুর রউফ (৮ এপ্রিল ১৯৭১) এবং সর্বকনিষ্ঠ বীরশ্রেষ্ঠ শহিদ সিপাহী মোস্তফা কামাল / ফ্লাইট লেফটেন্যান্ট মতিউর রহমান।", "category": "মুক্তিযুদ্ধ"}, {"id": 7, "question": "বাংলাদেশকে প্রথম স্বীকৃতি প্রদানকারী দেশ কোনটি?", "answer": "ভুটান (৬ ডিসেম্বর ১৯৭১ সকালে) এবং একই দিন কয়েক ঘণ্টা পর দ্বিতীয় দেশ হিসেবে ভারত বাংলাদেশকে আনুষ্ঠানিকভাবে স্বীকৃতি দেয়।", "category": "মুক্তিযুদ্ধ"}, {"id": 8, "question": "ঐতিহাসিক ৭ই মার্চের ভাষণকে ইউনেস্কো কবে বিশ্ব প্রামাণ্য ঐতিহ্য হিসেবে স্বীকৃতি দেয়?", "answer": "২০১৭ সালের ৩০ অক্টোবর ইউনেস্কো (UNESCO) বঙ্গবন্ধুর ৭ই মার্চের ঐতিহাসিক ভাষণকে 'Memory of the World International Register'-এ অন্তর্ভুক্ত করে বিশ্ব প্রামাণ্য ঐতিহ্য হিসেবে স্বীকৃতি দেয়।", "category": "ঐতিহ্য"}, {"id": 9, "question": "বাংলাদেশের সংবিধান কবে গৃহীত হয় এবং কবে থেকে কার্যকর হয়?", "answer": "১৯৭২ সালের ৪ নভেম্বর গণপরিষদে বাংলাদেশের সংবিধান গৃহীত হয় এবং একই বছর ১৬ ডিসেম্বর (প্রথম বিজয় দিবসে) থেকে এটি কার্যকর হয়।", "category": "সংবিধান"}, {"id": 10, "question": "সংবিধানের মূলনীতি কয়টি ও কি কি?", "answer": "বাংলাদেশের সংবিধানের মূলনীতি ৪টি: ১. জাতীয়তাবাদ, ২. সমাজতন্ত্র, ৩. গণতন্ত্র এবং ৪. ধর্মনিরপেক্ষতা (সংবিধানের ৮ নং অনুচ্ছেদ)।", "category": "সংবিধান"}, {"id": 11, "question": "সংবিধানে মৌলিক অধিকার সম্পর্কিত অনুচ্ছেদগুলো কোন ভাগে সন্নিবেশিত?", "answer": "সংবিধানের তৃতীয় ভাগে (অনুচ্ছেদ ২৭ থেকে ৪৪ পর্যন্ত) নাগরিকদের মৌলিক অধিকার সন্নিবেশিত রয়েছে।", "category": "সংবিধান"}, {"id": 12, "question": "সংবিধানের ৭(ক) ও ৭(খ) অনুচ্ছেদে কী বর্ণিত আছে?", "answer": "৭(ক) অনুচ্ছেদে সংবিধান বাতিল, স্থগিতকরণ ইত্যাদিকে রাষ্ট্রদ্রোহিতা হিসেবে গণ্য করে সর্বোচ্চ শাস্তির বিধান এবং ৭(খ) অনুচ্ছেদে সংবিধানের মৌলিক বিধানাবলী সংশোধন অযোগ্য ঘোষণা করা হয়েছে।", "category": "সংবিধান"}, {"id": 13, "question": "পদ্মা সেতুর দৈর্ঘ্য, প্রস্থ এবং স্প্যান সংখ্যা কত?", "answer": "পদ্মা বহুমুখী সেতুর দৈর্ঘ্য ৬.১৫ কিলোমিটার (ভায়াডাক্টসহ ৯.৩ কিমি), প্রস্থ ১৮.১০ মিটার, মোট স্প্যান ৪১টি এবং পিলার ৪২টি। এটি ২৫ জুন ২০২২ উদ্বোধন করা হয়।", "category": "মেগা প্রজেক্ট"}, {"id": 14, "question": "বাংলাদেশের প্রথম মেট্রোরেলের নাম কী এবং এর রুট কোনটি?", "answer": "প্রথম মেট্রোরেলের নাম MRT Line-6। এটি উত্তরা (দিয়াবাড়ি) থেকে মতিঝিল/কমলাপুর পর্যন্ত বিস্তৃত। এর প্রথম অংশ (উত্তরা-আগারগাঁও) ২৮ ডিসেম্বর ২০২২ উদ্বোধন করা হয়।", "category": "মেগা প্রজেক্ট"}, {"id": 15, "question": "বঙ্গবন্ধু শেখ মুজিবুর রহমান টানেল কোন নদীর তলদেশে নির্মিত এবং এর দৈর্ঘ্য কত?", "answer": "কর্ণফুলী নদীর তলদেশে নির্মিত। মূল টানেলের দৈর্ঘ্য ৩.৩২ কিলোমিটার (অ্যাপ্রোচ রোডসহ ৯.৩৯ কিমি)। এটি দক্ষিণ এশিয়ায় নদীর তলদেশে প্রথম টানেল, উদ্বোধন হয় ২৮ অক্টোবর ২০২৩।", "category": "মেগা প্রজেক্ট"}, {"id": 16, "question": "রূপপুর পারমাণবিক বিদ্যুৎ কেন্দ্র কোন জেলায় অবস্থিত এবং এর উৎপাদন ক্ষমতা কত?", "answer": "পাবনা জেলার ঈশ্বরদীতে অবস্থিত। এর মোট বিদ্যুৎ উৎপাদন ক্ষমতা ২,৪০০ মেগাওয়াট (দুটি ইউনিটে ১,২০০ মেগাওয়াট করে)। রাশিয়ার সহায়তায় এটি বাস্তবায়িত হচ্ছে।", "category": "মেগা প্রজেক্ট"}, {"id": 17, "question": "বঙ্গবন্ধু স্যাটেলাইট-১ কবে উৎক্ষেপণ করা হয় এবং কোথা থেকে?", "answer": "২০১৮ সালের ১২ মে (বাংলাদেশ সময়) যুক্তরাষ্ট্রের ফ্লোরিডার কেনেডি স্পেস সেন্টার থেকে স্পেসএক্স-এর ফ্যালকন-৯ রকেটের মাধ্যমে উৎক্ষেপণ করা হয়। কক্ষপথ ১১৯.১° পূর্ব দ্রাঘিমাংশ।", "category": "প্রযুক্তি"}, {"id": 18, "question": "বাংলাদেশের একমাত্র গভীর সমুদ্র বন্দর কোনটি এবং কোথায় অবস্থিত?", "answer": "মাতারবাড়ী গভীর সমুদ্র বন্দর, যা কক্সবাজার জেলার মহেশখালী উপজেলার মাতারবাড়ীতে অবস্থিত (জাপানের জাইকার অর্থায়নে নির্মিত)।", "category": "মেগা প্রজেক্ট"}, {"id": 19, "question": "সংবিধানের কত নম্বর অনুচ্ছেদ অনুযায়ী ন্যায়পাল (Ombudsman) নিয়োগের বিধান আছে?", "answer": "সংবিধানের ৭৭ নম্বর অনুচ্ছেদ অনুযায়ী জাতীয় সংসদ আইনের দ্বারা ন্যায়পাল প্রতিষ্ঠার বিধান করতে পারবে।", "category": "সংবিধান"}, {"id": 20, "question": "বাংলাদেশের জাতীয় সংসদের আসন সংখ্যা কত এবং সংরক্ষিত মহিলা আসন কতটি?", "answer": "মোট আসন ৩৫০টি; এর মধ্যে ৩০০টি সাধারণ আসন এবং ৫০টি মহিলাদের জন্য সংরক্ষিত আসন (সংবিধানের ৬৫ নং অনুচ্ছেদ)।", "category": "সংবিধান"}, {"id": 21, "question": "ঢাকা এলিভেটেড এক্সপ্রেসওয়ের মোট দৈর্ঘ্য কত এবং প্রথম অংশ কবে চালু হয়?", "answer": "মূল এক্সপ্রেসওয়ের দৈর্ঘ্য ১৯.৭৩ কিলোমিটার (র‌্যাম্পসহ ৪৬.৭৩ কিমি)। প্রথম অংশ (বিমানবন্দর থেকে ফার্মগেট) ২০২৩ সালের ২ সেপ্টেম্বর উদ্বোধন করা হয়।", "category": "মেগা প্রজেক্ট"}, {"id": 22, "question": "বঙ্গবন্ধুর লেখা তিনটি আত্মজীবনীমূলক বইয়ের নাম লিখুন।", "answer": "১. অসমাপ্ত আত্মজীবনী (২০১২), ২. কারাগারের রোজনামচা (২০১৭), এবং ৩. আমার দেখা নয়াচীন (২০২০)।", "category": "ইতিহাস"}, {"id": 23, "question": "মুক্তিযুদ্ধে অবদানের জন্য কতজন বিদেশি নাগরিককে বীরপ্রতীক খেতাব দেওয়া হয়?", "answer": "একমাত্র বিদেশি নাগরিক হিসেবে ডব্লিউ এ এস ওডারল্যান্ড (অস্ট্রেলিয়ান নাগরিক)-কে বীরপ্রতীক খেতাব দেওয়া হয়।", "category": "মুক্তিযুদ্ধ"}, {"id": 24, "question": "বাংলাদেশের প্রথম নারী প্রধানমন্ত্রীর নাম ও শপথের সাল লিখুন।", "answer": "বেগম খালেদা জিয়া, তিনি ১৯৯১ সালের ২০ মার্চ প্রথম নারী প্রধানমন্ত্রী হিসেবে শপথ গ্রহণ করেন।", "category": "রাজনীতি"}, {"id": 25, "question": "জাতীয় স্মৃতিসৌধের স্থপতি কে এবং এতে কয়টি ফলক রয়েছে?", "answer": "স্থপতি সৈয়দ মাইনুল হোসেন। জাতীয় স্মৃতিসৌধে মোট ৭ জোড়া বা ৭টি ত্রিকোণাকৃতি দেয়াল/ফলক রয়েছে, যা বাংলাদেশের ইতিহাসের ৭টি মাইলফলককে নির্দেশ করে।", "category": "ঐতিহ্য"}, {"id": 26, "question": "ভাষা আন্দোলনের প্রথম শহিদ কে এবং শহিদ মিনার প্রথম কবে নির্মিত হয়?", "answer": "ভাষা আন্দোলনের প্রথম শহিদ রফিকউদ্দিন আহমদ। প্রথম শহিদ মিনার নির্মিত হয় ১৯৫২ সালের ২৩ ফেব্রুয়ারি ঢাকা মেডিকেল কলেজ হোস্টেল প্রাঙ্গণে।", "category": "ভাষা আন্দোলন"}, {"id": 27, "question": "আন্তর্জাতিক মাতৃভাষা দিবস হিসেবে ২১শে ফেব্রুয়ারিকে ইউনেস্কো কবে স্বীকৃতি দেয়?", "answer": "১৯৯৯ সালের ১৭ নভেম্বর ইউনেস্কোর ৩০তম সাধারণ অধিবেশনে সর্বসম্মতিক্রমে ২১শে ফেব্রুয়ারিকে আন্তর্জাতিক মাতৃভাষা দিবস হিসেবে ঘোষণা করা হয় (প্রথম পালিত হয় ২০০০ সালে)।", "category": "ঐতিহ্য"}, {"id": 28, "question": "যুক্তফ্রন্ট কত সালে গঠিত হয় এবং তাদের নির্বাচনী প্রতীক কী ছিল?", "answer": "১৯৫৩ সালের ৪ ডিসেম্বর যুক্তফ্রন্ট গঠিত হয় এবং ১৯৫৪ সালের প্রাদেশিক নির্বাচনে যুক্তফ্রন্টের নির্বাচনী প্রতীক ছিল 'নৌকা'।", "category": "ইতিহাস"}, {"id": 29, "question": "আগরতলা ষড়যন্ত্র মামলার আনুষ্ঠানিক নাম কী ছিল এবং এতে মোট আসামি কতজন ছিলেন?", "answer": "আনুষ্ঠানিক নাম ছিল 'রাষ্ট্র বনাম শেখ মুজিবুর রহমান ও অন্যান্য'। এতে বঙ্গবন্ধু শেখ মুজিবুর রহমানসহ মোট ৩৫ জনকে আসামি করা হয়।", "category": "ইতিহাস"}, {"id": 30, "question": "বঙ্গবন্ধুকে 'বঙ্গবন্ধু' উপাধি কে এবং কবে প্রদান করেন?", "answer": "১৯৬৯ সালের ২৩ ফেব্রুয়ারি ঢাকার তৎকালীন রেসকোর্স ময়দানে (বর্তমান সোহরাওয়ার্দী উদ্যান) ছাত্র সংগ্রাম পরিষদের পক্ষে তৎকালীন ডাকসু ভিপি তোফায়েল আহমেদ এ উপাধি দেন।", "category": "ইতিহাস"}, {"id": 31, "question": "অপারেশন সার্চলাইট (Operation Searchlight) কী এবং এটি কবে পরিচালিত হয়?", "answer": "১৯৭১ সালের ২৫ মার্চ কালরাতে পাকিস্তানি হানাদার বাহিনী ঢাকাসহ সারাদেশে ঘুমন্ত ও নিরস্ত্র বাঙালিদের ওপর যে বর্বরোচিত গণহত্যা শুরু করে, তারই সামরিক সাংকেতিক নাম 'অপারেশন সার্চলাইট'।", "category": "মুক্তিযুদ্ধ"}, {"id": 32, "question": "স্বাধীনতার ঘোষণাপত্র (Proclamation of Independence) কবে গৃহীত ও অনুমোদিত হয়?", "answer": "১৯৭১ সালের ১০ এপ্রিল মুজিবনগরে আনুষ্ঠানিকভাবে স্বাধীনতার ঘোষণাপত্র গৃহীত হয় এবং ১৯৭১ সালের ২৬ মার্চ থেকে এটি কার্যকর ঘোষণা করা হয়।", "category": "মুক্তিযুদ্ধ"}, {"id": 33, "question": "বাংলাদেশকে স্বীকৃতি দানকারী প্রথম ইউরোপীয় দেশ কোনটি?", "answer": "পোল্যান্ড ও যুগোস্লাভিয়া (২৬ জানুয়ারি ১৯৭২)। তবে সমাজতান্ত্রিক শিবিরের পরাশক্তি সোভিয়েত ইউনিয়ন বাংলাদেশকে স্বীকৃতি দেয় ২৪ জানুয়ারি ১৯৭২।", "category": "মুক্তিযুদ্ধ"}, {"id": 34, "question": "বাংলাদেশের জাতীয় পতাকার ডিজাইনার কে?", "answer": "কামরুল হাসান। (প্রথম পতাকার নকশাকার ছিলেন শিব নারায়ণ দাশ)।", "category": "জাতীয় বিষয়"}, {"id": 35, "question": "জাতীয় সংগীতের রচয়িতা কে এবং এটি কোন কাব্যগ্রন্থ থেকে নেওয়া হয়েছে?", "answer": "রবীন্দ্রনাথ ঠাকুর। এটি তাঁর 'গীতবিতান' বা 'স্বদেশ' পর্যায়ের গান এবং 'বাউল' ভাবধারা থেকে রচিত। গানটির প্রথম ১০ লাইন রাষ্ট্রীয় অনুষ্ঠানে গাওয়া হয়।", "category": "জাতীয় বিষয়"}, {"id": 36, "question": "বাংলাদেশের রণসঙ্গীতের রচয়িতা কে এবং এর কত চরণ রাষ্ট্রীয় অনুষ্ঠানে বাজানো হয়?", "answer": "জাতীয় কবি কাজী নজরুল ইসলাম (গান: 'চল্ চল্ চল্')। এর প্রথম ২১ চরণ রণসঙ্গীত হিসেবে গৃহীত এবং প্রথম ১২ চরণ সামরিক অনুষ্ঠানে বাজানো হয়।", "category": "জাতীয় বিষয়"}, {"id": 37, "question": "বাংলাদেশের একমাত্র পাহাড়ি দ্বীপ কোনটি?", "answer": "মহেশখালী (কক্সবাজার জেলা)।", "category": "ভূগোল"}, {"id": 38, "question": "বাংলাদেশের একমাত্র প্রবাল দ্বীপ কোনটি?", "answer": "সেন্টমার্টিন বা নারিকেল জিঞ্জিরা।", "category": "ভূগোল"}, {"id": 39, "question": "সুন্দরবনকে ইউনেস্কো কবে বিশ্ব ঐতিহ্য (World Heritage Site) হিসেবে ঘোষণা করে?", "answer": "১৯৯৭ সালের ৬ ডিসেম্বর ইউনেস্কো সুন্দরবনকে ৭৯৮তম বিশ্ব ঐতিহ্য হিসেবে ঘোষণা করে।", "category": "ঐতিহ্য"}, {"id": 40, "question": "বাংলাদেশের কেন্দ্রীয় ব্যাংকের নাম কী এবং এটি কবে প্রতিষ্ঠিত হয়?", "answer": "বাংলাদেশ ব্যাংক। এটি ১৯৭১ সালের ১৬ ডিসেম্বর কার্যকর হয় এবং ১৯৭২ সালের বাংলাদেশ ব্যাংক আদেশ অনুযায়ী আনুষ্ঠানিকভাবে কাজ শুরু করে।", "category": "অর্থনীতি"}, {"id": 41, "question": "বাংলাদেশের সর্বোচ্চ বিচারালয়ের নাম কী এবং এর বিভাগ কয়টি?", "answer": "বাংলাদেশ সুপ্রিম কোর্ট। এর দুটি বিভাগ রয়েছে: ১. আপিল বিভাগ এবং ২. হাইকোর্ট বিভাগ।", "category": "সংবিধান"}, {"id": 42, "question": "সংবিধান অনুযায়ী রাষ্ট্রপতির অভিশংসন সংক্রান্ত বিধান কোন অনুচ্ছেদে রয়েছে?", "answer": "সংবিধানের ৫২ নম্বর অনুচ্ছেদে রাষ্ট্রপতির অভিশংসন (Impeachment) সংক্রান্ত বিধান রয়েছে।", "category": "সংবিধান"}, {"id": 43, "question": "সংবিধানের তত্ত্বাবধায়ক সরকার ব্যবস্থা কোন সংশোধনীর মাধ্যমে বাতিল করা হয়?", "answer": "২০১১ সালের পঞ্চদশ (১৫তম) সংশোধনীর মাধ্যমে।", "category": "সংবিধান"}, {"id": 44, "question": "সংবিধানে জরুরি অবস্থা ঘোষণার ক্ষমতা কার হাতে ন্যস্ত এবং কোন অনুচ্ছেদে বর্ণিত?", "answer": "রাষ্ট্রপতির হাতে (প্রধানমন্ত্রীর প্রতিস্বাক্ষর সাপেক্ষে), যা সংবিধানের ১৪১(ক) অনুচ্ছেদে বর্ণিত রয়েছে।", "category": "সংবিধান"}, {"id": 45, "question": "পদ্মা সেতু প্রকল্পের নদী শাসন চুক্তি কোন দেশের কোম্পানির সাথে হয়েছিল?", "answer": "চীনের সিনোহাইড্রো কর্পোরেশন (Sinohydro Corporation)। মূল সেতু নির্মাণ করে চায়না মেজর ব্রিজ ইঞ্জিনিয়ারিং কোম্পানি (MBEC)।", "category": "মেগা প্রজেক্ট"}, {"id": 46, "question": "হযরত শাহজালাল আন্তর্জাতিক বিমানবন্দরের তৃতীয় টার্মিনাল কবে আংশিক উদ্বোধন করা হয়?", "answer": "২০২৩ সালের ৭ অক্টোবর প্রধানমন্ত্রী শেখ হাসিনা তৃতীয় টার্মিনালের সফট ওপেনিং উদ্বোধন করেন। এর প্রধান স্থপতি রোহানি বাহারিন।", "category": "মেগা প্রজেক্ট"}, {"id": 47, "question": "বঙ্গবন্ধু টানেলের দুটি টিউবের সংযোগকারী মোট লেন সংখ্যা কত?", "answer": "মোট ৪টি লেন (প্রতিটি টিউবে ২টি করে লেন)।", "category": "মেগা প্রজেক্ট"}, {"id": 48, "question": "মাতারবাড়ী কয়লাভিত্তিক বিদ্যুৎ কেন্দ্রের উৎপাদন ক্ষমতা কত?", "answer": "১,২০০ মেগাওয়াট (৬০০ মেগাওয়াটের দুটি ইউনিট)।", "category": "মেগা প্রজেক্ট"}, {"id": 49, "question": "মুক্তিযুদ্ধের বীরত্বসূচক ৪টি রাষ্ট্রীয় খেতাব কী কী এবং এদের ক্রম লিখুন।" estion": "বঙ্গবন্ধু জাতিসংঘ সাধারণ পরিষদে প্রথম বাংলায় ভাষণ দেন কবে?", "answer": "১৯৭৪ সালের ২৫ সেপ্টেম্বর জাতিসংঘের ২৯তম সাধারণ অধিবেশনে বঙ্গবন্ধু বাংলায় প্রথম ভাষণ প্রদান করেন।", "category": "ইতিহাস"}, {"id": 59, "question": "বাংলাদেশের সবচেয়ে বড় স্থলবন্দর কোনটি?", "answer": "বেনাপোল স্থলবন্দর (যশোর জেলা)।", "category": "বাণিজ্য"}, {"id": 60, "question": "বাংলাদেশ ব-দ্বীপ পরিকল্পনা ২১০০ (Delta Plan 2100) কবে অনুমোদিত হয়?", "answer": "২০১৮ সালের ৪ সেপ্টেম্বর জাতীয় অর্থনৈতিক পরিষদ (NEC) কর্তৃক ১০০ বছর মেয়াদী এই দীর্ঘমেয়াদী কৌশলগত পরিকল্পনা অনুমোদিত হয়।", "category": "পরিকল্পনা"}, {"id": 61, "question": "প্রাচীন বাংলার প্রথম স্বাধীন নরপতি কে ছিলেন?", "answer": "শশাঙ্ক (গৌড়ের রাজা, ৭ম শতক)।", "category": "ইতিহাস"}, {"id": 62, "question": "মৎস্যন্যায় কী এবং এটি কোন শতাব্দীতে বিদ্যমান ছিল?", "answer": "৭ম থেকে ৮ম শতাব্দীতে (শশাঙ্কের মৃত্যুর পর প্রায় একশত বছর) বাংলায় বিরাজমান চরম নৈরাজ্য ও অরাজক পরিস্থিতিকে মৎস্যন্যায় বলা হয়।", "category": "ইতিহাস"}, {"id": 63, "question": "বাংলায় প্রথম দীর্ঘস্থায়ী রাজবংশের নাম কী?", "answer": "পাল রাজবংশ (প্রতিষ্ঠাতা গোপাল, শাসনকাল প্রায় ৪০০ বছর)।", "category": "ইতিহাস"}, {"id": 64, "question": "সেন বংশের প্রতিষ্ঠাতা কে এবং শেষ রাজা কে ছিলেন?", "answer": "প্রতিষ্ঠাতা সামন্তসেন / বিজয়সেন এবং শেষ রাজা ছিলেন লক্ষণসেন।", "category": "ইতিহাস"}, {"id": 65, "question": "ইখতিয়ার উদ্দীন মুহম্মদ বিন বখতিয়ার খলজি কবে বাংলা জয় করেন?", "answer": "১২০৪ সালে রাজা লক্ষণসেনকে পরাজিত করে নদীয়া ও গৌড় অধিকার করেন।", "category": "ইতিহাস"}, {"id": 66, "question": "বাংলার প্রথম স্বাধীন সুলতান কে ছিলেন?", "answer": "ফখরুদ্দীন মুবারক শাহ (১৩৩৮ সাল)।", "category": "ইতিহাস"}, {"id": 67, "question": "ইলিয়াস শাহী বংশের প্রতিষ্ঠাতা কে এবং তাঁর উপাধি কী ছিল?", "answer": "শামসুদ্দীন ইলিয়াস শাহ। তিনি 'শাহ-ই-বাঙ্গালাহ' উপাধি গ্রহণ করেন।", "category": "ইতিহাস"}, {"id": 68, "question": "মুঘল সুবাদার ইসলাম খান কবে ঢাকাকে বাংলার রাজধানী করেন?", "answer": "১৬১০ সালে। ঢাকার তৎকালীন নাম রাখা হয়েছিল জাহাঙ্গীরনগর।", "category": "ইতিহাস"}, {"id": 69, "question": "পলাশীর যুদ্ধ কবে সংঘটিত হয় এবং নবাব সিরাজউদ্দৌলার প্রধান সেনাপতি কে ছিলেন?", "answer": "১৭৫৭ সালের ২৩ জুন। প্রধান সেনাপতি ছিলেন বিশ্বাসঘাতক মীর জাফর।", "category": "ইতিহাস"}, {"id": 70, "question": "বক্সারের যুদ্ধ কবে সংঘটিত হয়?", "answer": "১৭৬৪ সালের ২২ অক্টোবর (ইংরেজদের বিরুদ্ধে মীর কাসিম, সুজাউদ্দৌলা ও শাহ আলমের যৌথ বাহিনী)।", "category": "ইতিহাস"}, {"id": 71, "question": "বাংলায় চিরস্থায়ী বন্দোবস্ত (Permanent Settlement) কবে এবং কে প্রবর্তন করেন?", "answer": "১৭৯৩ সালে লর্ড কর্নওয়ালিস প্রবর্তন করেন।", "category": "ইতিহাস"}, {"id": 72, "question": "ফরায়েজী আন্দোলনের প্রতিষ্ঠাতা কে ছিলেন?", "answer": "হাজী শরীয়তুল্লাহ (মাদারীপুর জেলায় জন্ম)।", "category": "ইতিহাস"}, {"id": 73, "question": "তিতুমীর কেন স্মরণীয় এবং বাঁশের কেল্লা কোথায় নির্মাণ করেছিলেন?", "answer": "ব্রিটিশবিরোধী নীলকর বিরোধী আন্দোলনের জন্য; বারাসাতের নারকেলবাড়িয়ায় ১৮৩১ সালে বাঁশের কেল্লা তৈরি করেন।", "category": "ইতিহাস"}, {"id": 74, "question": "সিপাহী বিদ্রোহ কবে এবং কোথা থেকে শুরু হয়?", "answer": "১৮৫৭ সালের মার্চ মাসে ব্যারাকপুরে মঙ্গল পাণ্ডের নেতৃত্বে শুরু হয়।", "category": "ইতিহাস"}, {"id": 75, "question": "বঙ্গভঙ্গ কবে কার্যকর হয় এবং কে ঘোষণা করেছিলেন?", "answer": "১৯০৫ সালের ১৬ অক্টোবর লর্ড কার্জন কর্তৃক কার্যকর হয়।", "category": "ইতিহাস"}, {"id": 76, "question": "বঙ্গভঙ্গ কবে রদ (বাতিল) করা হয়?", "answer": "১৯১১ সালের ১২ ডিসেম্বর ব্রিটিশ সম্রাট পঞ্চম জর্জ কর্তৃক।", "category": "ইতিহাস"}, {"id": 77, "question": "সর্বভারতীয় মুসলিম লীগ কবে এবং কোথায় প্রতিষ্ঠিত হয়?", "answer": "১৯০৬ সালের ৩০ ডিসেম্বর ঢাকায় নবাব সলিমুল্লাহর উদ্যোগে প্রতিষ্ঠিত হয়।", "category": "ইতিহাস"}, {"id": 78, "question": "লাহোর প্রস্তাব কবে এবং কে উত্থাপন করেন?", "answer": "১৯৪০ সালের ২৩ মার্চ এ কে ফজলুল হক (শেরে বাংলা) লাহোরে উত্থাপন করেন।", "category": "ইতিহাস"}, {"id": 79, "question": "ভারত ও পাকিস্তান বিভক্তকারী সীমারেখার নাম কী?", "answer": "র‌্যাডক্লিফ লাইন (Radcliffe Line, ১৯৪৭ সাল)।", "category": "ভূগোল"}, {"id": 80, "question": "১৯৫২ সালের ভাষা আন্দোলনের সময় পাকিস্তানের প্রধানমন্ত্রী ও পূর্ব বাংলার মুখ্যমন্ত্রী কে ছিলেন?", "answer": "পাকিস্তানের প্রধানমন্ত্রী খাজা নাজিমুদ্দীন এবং পূর্ব বাংলার মুখ্যমন্ত্রী নূরুল আমীন।", "category": "ইতিহাস"}, {"id": 81, "question": "তমদ্দুন মজলিস কী এবং এটি কবে গঠিত হয়?", "answer": "ভাষা আন্দোলনের প্রথম সাংস্কৃতিক সংগঠন, ১৯৪৭ সালের ২ সেপ্টেম্বর ঢাকা বিশ্ববিদ্যালয়ের অধ্যাপক আবুল কাসেমের নেতৃত্বে গঠিত।", "category": "ইতিহাস"}, {"id": 82, "question": "প্রথম শহীদ মিনারের ভিত্তিপ্রস্তর কে স্থাপন করেন?", "answer": "শহীদ শফিউর রহমানের পিতা এবং উদ্বোধন করেন শহীদ আবুল বরকতের মা হাসিনা বেগম।", "category": "ইতিহাস"}, {"id": 83, "question": "১৯৫৪ সালের নির্বাচনে যুক্তফ্রন্টের ২১ দফার প্রথম দফা কী ছিল?", "answer": "বাংলাকে পাকিস্তানের অন্যতম রাষ্ট্রভাষা করা।", "category": "ইতিহাস"}, {"id": 84, "question": "ঐতিহাসিক ৬ দফার প্রথম দুটি দফা কী ছিল?", "answer": "১. শাসনতান্ত্রিক কাঠামো ও রাষ্ট্রের প্রকৃতি (লাহোর প্রস্তাবের ভিত্তিতে স্বায়ত্তশাসন), ২. কেন্দ্রীয় সরকারের ক্ষমতা (কেবল প্রতিরক্ষা ও পররাষ্ট্র)।", "category": "ইতিহাস"}, {"id": 85, "question": "১৯৬৯ সালের গণঅভ্যুত্থানে শহিদ হওয়া ঢাকা বিশ্ববিদ্যালয়ের ছাত্রনেতার নাম কী?", "answer": "আসাদুজ্জামান (শহীদ আসাদ, ২০ জানুয়ারি ১৯৬৯)।", "category": "ইতিহাস"}, {"id": 86, "question": "রাজশাহী বিশ্ববিদ্যালয়ের কোন শিক্ষক ১৯৬৯ সালে শহিদ হন?", "answer": "অধ্যাপক ড. শামসুজ্জোহা (১৮ ফেব্রুয়ারি ১৯৬৯)।", "category": "ইতিহাস"}, {"id": 87, "question": "১৯৭০ সালের সাধারণ নির্বাচনে আওয়ামী লীগ জাতীয় পরিষদে কয়টি আসন লাভ করে?", "answer": "পূর্ব পাকিস্তানের ১৬৯টি আসনের মধ্যে ১৬৭টি আসন (১৬২টি সাধারণ ও ৫টি সংরক্ষিত মহিলা আসন)।", "category": "ইতিহাস"}, {"id": 88, "question": "বঙ্গবন্ধুর ৭ই মার্চের ভাষণের সময়কাল কত ছিল এবং কোন ময়দানে দিয়েছিলেন?", "answer": "প্রায় ১৯ মিনিট (প্রকৃতপক্ষে ১৮ মিনিট ৩১ সেকেন্ড), তৎকালীন রেসকোর্স ময়দানে।", "category": "ইতিহাস"}, {"id": 89, "question": "স্বাধীন বাংলা বেতার কেন্দ্র প্রথম কোথা থেকে সম্প্রচার শুরু করে?", "answer": "চট্টগ্রামের কালুরঘাট বেতার কেন্দ্র থেকে (২৬ মার্চ ১৯৭১)।", "category": "মুক্তিযুদ্ধ"}, {"id": 90, "question": "এম এ জি ওসমানী মুক্
